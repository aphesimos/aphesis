<title>aphes.is works</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="works · opera: finished projects, each shown alone as a simulacrum in the fog.">
<style>
/*__CSS__*/
</style>
<!--__BODY__-->
<canvas id="fog" aria-hidden="true"></canvas>

<a id="seal" href="#home" aria-label="aphes.is · back to the center" data-cursor=".9"></a>

<main id="works">
  <!-- the list: one inscription line, a grain for each work -->
  <section id="list" class="view" aria-labelledby="title" inert>
    <h1 id="title" class="head enter aph-ink"><span class="gloss-title" data-tip="opera · works" aria-hidden="true">opera</span><span class="title">works</span></h1>
    <nav id="inscription" aria-label="works">
      <svg class="line enter" aria-hidden="true" focusable="false"><path></path></svg>
      <ol id="names"></ol>
    </nav>
  </section>

  <!-- one work, alone -->
  <article id="work" class="view" aria-labelledby="wName" inert>
    <figure id="figure">
      <canvas id="picture" aria-hidden="true"></canvas>
      <figcaption id="caption" class="aph-meta aph-on-fog aph-ink"></figcaption>
    </figure>
    <div id="text">
      <h2 id="wName" class="head enter aph-ink" tabindex="-1"><span class="gloss-title" id="wGloss"></span><span class="title" id="wTitle"></span></h2>
      <p id="wDesc" class="desc enter aph-ink"></p>
      <p id="wMeta" class="aph-meta meta enter aph-ink"></p>
      <ul id="wLinks" class="links"></ul>
      <div class="ways">
        <a id="back" class="way enter" href="#works" data-cursor=".55"><span class="txt">all works</span></a>
        <a id="next" class="way enter" href="#works" data-cursor=".55"><span class="txt"></span></a>
      </div>
    </div>
  </article>
</main>

<div class="corner" id="controls">
  <button id="bTheme" type="button" aria-label="switch between light and dark" data-tip="open · close the eye" data-cursor=".55"><span class="eye open"></span><span class="eye closed"></span></button>
</div>

<div class="sr" id="announce" aria-live="polite"></div>
