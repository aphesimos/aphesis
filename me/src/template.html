<script>
/* before the first paint: the theme the reader chose last time, and the classes the motion's hidden states hang on.
   mo = scripts and motion are allowed (nothing is hidden without it); intro = the entrance will play (the page is at
   the top, with no hash); sealwait = the corner seal waits for the φ to arrive. A safety timeout lifts every hidden
   state if the page's script never starts. */
(function () {
  var d = document.documentElement;
  try { var t = localStorage.getItem('aphesis.me.theme'); if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t); } catch (e) {}
  var calm = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (calm) return;
  d.classList.add('mo');
  if ((window.pageYOffset || 0) < 10 && !location.hash) d.classList.add('intro', 'sealwait');
  setTimeout(function () { if (!window.__meAlive) d.classList.remove('mo', 'intro', 'sealwait'); }, 6000);
})();
</script>
