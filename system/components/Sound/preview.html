<!-- @dsCard group="Sound" height=560 subtitle="the sound lab: every voice, the events, the ear, and the level in stipple; it starts on its own or at the first touch" -->
<div class="lab">
  <div class="row top">
    <div class="corner"><button id="eye" type="button" aria-label="switch between light and dark" data-tip="open · close the eye" data-cursor=".55"></button><button id="ear"></button></div>
    <p class="aph-meta st" id="st" aria-live="polite">silent</p>
  </div>
  <canvas id="meter" aria-hidden="true"></canvas>
  <p class="aph-meta h">voices</p>
  <div class="row" id="scenes"></div>
  <div class="row" id="chambers" hidden></div>
  <p class="aph-meta h">events</p>
  <div class="row" id="events"></div>
  <p class="aph-meta h">a track plays</p>
  <div class="row"><button type="button" class="aph-label" id="duck" aria-pressed="false">duck</button></div>
</div>
<style>
.lab{padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-3);max-width:760px}
.row[hidden]{display:none}
.row{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);align-items:center}
.top{justify-content:space-between}
.corner{display:flex;gap:6px;margin-left:-6px}
#eye{background:none;border:0;padding:6px;color:var(--accent);cursor:pointer}
#eye svg{width:30px;height:30px;display:block;overflow:visible}
.h{margin:var(--space-3) 0 0}
.row button.aph-label{background:none;border:0;padding:var(--space-1) 0;color:var(--ink-soft);cursor:pointer;transition:color var(--duration-quick) ease}
.row button.aph-label:hover,.row button.aph-label[aria-pressed="true"]{color:var(--accent-text)}
.row button.aph-label[aria-pressed="true"]{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
#meter{width:100%;height:96px;display:block;image-rendering:pixelated}
.st{min-height:1.6em;text-align:right}
</style>
<script>
(function () {
  var S = Aphesis.Sound, $ = function (id) { return document.getElementById(id); };
  Aphesis.tooltip();
  /* the eye beside the ear, as in the corner of every screen */
  var dark = function () { var r = document.documentElement; return r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
  function eye() { $('eye').innerHTML = Aphesis.icon('eye', dark() ? 1 : 0); $('eye').dataset.tip = dark() ? 'closed · open the eye' : 'open · close the eye'; }
  eye(); $('eye').onclick = function () { var d = !dark(); document.documentElement.dataset.theme = d ? 'dark' : 'light'; eye(); S.event('shift'); };
  S.ear($('ear'));
  S.start({ fade: 4000 });

  var scene = 'home', chamber = 0;
  function pick(box, items, cur, fn) {
    box.innerHTML = '';
    items.forEach(function (it, i) { var b = document.createElement('button'); b.type = 'button'; b.className = 'aph-label'; b.textContent = it; b.setAttribute('aria-pressed', String(it === cur || i === cur)); b.onclick = function () { fn(it, i); }; box.appendChild(b); });
  }
  function draw() {
    pick($('scenes'), S.voices, scene, function (n) { scene = n; chamber = 0; S.scene(n, n === 'experimental' ? { chamber: 0 } : {}); draw(); });
    $('chambers').hidden = scene !== 'experimental';
    pick($('chambers'), S.chambers, chamber, function (n, i) { chamber = i; S.scene('experimental', { chamber: i }); draw(); });
  }
  draw();
  pick($('events'), ['swell', 'door', 'coalesce', 'dissolve', 'impact', 'turn', 'shift', 'passage'], -1, function (k) { S.event(k); });
  $('duck').onclick = function () { var on = this.getAttribute('aria-pressed') !== 'true'; this.setAttribute('aria-pressed', String(on)); S.duck(on ? 0.05 : 1, on ? 1500 : 3000); };

  /* the level in stipple: each column is a moment, cells light where a field around the level passes a threshold */
  var cv = $('meter'), g = cv.getContext('2d'), hist = [], cols = 0, rows = 0, fog = [0, 0, 0], acc = [0, 0, 0], t = 0;
  function colors() { fog = Aphesis.cssColor('--fog'); acc = Aphesis.cssColor('--accent'); }
  colors(); new MutationObserver(colors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  function hash(x, y) { var h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); }
  function rgb(c, a) { return 'rgba(' + c.map(function (v) { return Math.round(v * 255); }).join(',') + ',' + a + ')'; }
  function frame() {
    requestAnimationFrame(frame); t++;
    var c = Aphesis.cellPx(2), r = cv.getBoundingClientRect(), w = Math.max(1, Math.round(r.width / c)), h = Math.max(1, Math.round(r.height / c));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    cols = w; rows = h;
    if (t % 3) return;
    var lv = S.level(), db = lv.rms > 0 ? 20 * Math.log10(lv.rms) : -90, pk = lv.peak > 0 ? 20 * Math.log10(lv.peak) : -90;
    hist.push([Aphesis.clamp((db + 60) / 45), Aphesis.clamp((pk + 60) / 45)]); while (hist.length > cols) hist.shift();
    g.clearRect(0, 0, w, h);
    var mid = h / 2;
    for (var i = 0; i < hist.length; i++) {
      var x = cols - hist.length + i, a = hist[i][0], p = hist[i][1], age = (hist.length - i) / cols;
      for (var y = 0; y < h; y++) {
        var d = Math.abs(y + 0.5 - mid) / mid, f = Aphesis.clamp(1 - d / Math.max(0.02, a)) * (1 - age * 0.6);
        if (hash(x, y + (t >> 4)) < f * 0.9) { g.fillStyle = rgb(fog, 0.66); g.fillRect(x, y, 1, 1); }
        else if (d < p && d > a && hash(y, x) < 0.06) { g.fillStyle = rgb(acc, 0.9); g.fillRect(x, y, 1, 1); }
      }
    }
    if (t % 15 === 0) $('st').textContent = (S.muted ? 'muted' : S.state === 'running' ? 'listening' : S.state === 'none' ? 'silent' : 'waiting for a touch') +
      ' · ' + scene + (scene === 'experimental' ? ' · ' + S.chambers[chamber] : '') + (S.state === 'running' ? ' · rms ' + db.toFixed(0) + ' dB · peak ' + pk.toFixed(0) + ' dB' : '');
  }
  frame();
})();
</script>
