/* aphes.ist components. Every value comes from tokens.css (generated from tokens.json). */
/* two faces only. Aphesis Script (fonts/, a file): the wordmark, titles and glosses, and every Greek or CJK
   character. Special Elite (Google Fonts): everything people read and operate; it falls back to Aphesis Script
   for the scripts it lacks. */
body { background: var(--bg); color: var(--ink); font-family: var(--font-text); }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }

/* tooltip: page ground, a hairline of accent on the left, small text typed fast */
.aph-tip {
  position: fixed; left: 0; top: 0; z-index: var(--z-tip); pointer-events: none;
  max-width: min(320px, calc(100vw - 32px)); padding: var(--space-2) var(--space-3);
  background: var(--bg); color: var(--ink-soft); border-left: 1px solid var(--accent);
  font: 400 11px/1.6 var(--font-text); letter-spacing: .06em;
  opacity: 0; filter: blur(4px); transform: translateY(4px);
  transition: opacity var(--duration-quick) ease, filter var(--duration-quick) ease, transform var(--duration-quick) var(--easing-settle);
}
.aph-tip.on { opacity: 1; filter: none; transform: none; }

/* cursor: a white disc in difference blend, the negative of whatever it covers */
@media (hover: hover) and (pointer: fine) {
  .aph-has-cursor, .aph-has-cursor *, .aph-has-cursor *::before, .aph-has-cursor *::after { cursor: none !important; }
}
.aph-cursor {
  position: fixed; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: var(--radius-disc);
  background: #fff; mix-blend-mode: difference; pointer-events: none; z-index: var(--z-cursor);
  transform: translate(-100px, -100px) scale(.2); opacity: 0; transition: opacity var(--duration-quick) ease;
}
.aph-cursor.on { opacity: 1; }

/* letter wave: letters lift a hair, one after another; nothing around them moves */
.ltr { display: inline-block; transition: transform var(--duration-slow) var(--easing-settle); transition-delay: calc(var(--i) * 22ms); }
.aph-wave:hover .ltr, .aph-wave:focus-visible .ltr { transform: translateY(-2px); }

/* typist caret: solid while typing, blinking when idle, fading when done */
.aph-caret { display: inline-block; width: .55em; height: 1.05em; margin-left: .12em; vertical-align: -.18em; background: currentColor; opacity: .75; }
.aph-caret.blink { animation: aph-blink 1.06s steps(1, end) infinite; }
.aph-caret.gone { opacity: 0; transition: opacity 1.2s ease; }
@keyframes aph-blink { 50% { opacity: 0; } }

/* type roles as classes (the same roles tokens.json lists) */
/* display text leans: titles and glosses take the slant axis at -12 (the φ stays upright on its own) */
.aph-display { font-family: var(--font-display); font-weight: 400; font-variation-settings: "wght" 400, "slnt" -12; text-transform: lowercase; line-height: .95; padding-right: .2em; }
.aph-gloss { font-family: var(--font-display); font-variation-settings: "wght" 400, "slnt" -12; letter-spacing: .02em; color: var(--ink-soft); text-transform: lowercase; }
.aph-label { font-family: var(--font-text); font-size: 13px; letter-spacing: .22em; text-transform: lowercase; }
.aph-meta { font-family: var(--font-text); font-size: 11px; letter-spacing: .14em; color: var(--ink-soft); }

/* text on fog keeps a halo of ground so it never sits on dots */
.aph-on-fog { text-shadow: 0 0 4px var(--bg), 0 0 10px var(--bg), 0 0 18px var(--bg); }


/* theme shift: the ground changes behind the page, cell by cell from the eye, and nothing on top stops.
   Mark the containers of black-and-white text with .aph-ink (not ones holding the seal, accents or their own ground):
   while the wave runs they blend by difference with white ink, so every glyph is the negative of the cell beneath it,
   old theme or new. Greys and hairlines get the one grey that reads right on both grounds. */
.aph-shifting .aph-ink {
  mix-blend-mode: difference; color: #fff;
  --ink: #fff; --fog: #fff; --ink-soft: var(--shift-soft); --line: var(--shift-line); --bg: #000;
  --accent: var(--shift-soft); --accent-text: var(--shift-soft);
}
/* the two frames around each switch: colours change without a transition (movement keeps its own) */
.aph-still body, .aph-still .aph-ink, .aph-still .aph-ink * { transition-property: opacity, filter, transform !important; }

/* the ear: the sound's switch, beside the eye. Listening, three arcs of stipple arrive at the ear and breathe with
   the level (--aph-lvl, set by the runtime); muted, they disperse and fall, and one stroke crosses the ear, drawn in
   from its end. Hovering stirs the points. */
.aph-ear { background: none; border: 0; padding: 6px; color: var(--accent); cursor: pointer; font: inherit; }
.aph-ear svg { width: 30px; height: 30px; display: block; overflow: visible; }
.aph-ear path { fill: currentColor; }
.aph-ear .w { opacity: calc(.6 + .4 * var(--aph-lvl, 1)); transform-origin: 9.6px 12.6px;
  transition: opacity var(--duration-slow) ease, transform 1.1s var(--easing-settle); }
.aph-ear .w2 { transition-delay: 60ms; } .aph-ear .w3 { transition-delay: 120ms; }
.aph-ear .slash { transform-origin: 4.2px 4.6px; transform: scale(0); transition: transform .9s var(--easing-settle); }
.aph-ear .loose { opacity: 0; transform: translate(-1.2px, -3px); transition: opacity var(--duration-slow) ease .25s, transform 1.1s var(--easing-settle) .2s; }
.aph-ear[aria-pressed="false"] .w { opacity: 0; transform: translate(2.2px, 1.6px) scale(1.16); }
.aph-ear[aria-pressed="false"] .w2 { transform: translate(2.8px, 2.6px) scale(1.12); }
.aph-ear[aria-pressed="false"] .w3 { transform: translate(3.2px, 3.6px) scale(1.08); }
.aph-ear[aria-pressed="false"] .slash { transform: none; transition-delay: .15s; }
.aph-ear[aria-pressed="false"] .loose { opacity: .7; transform: none; }
.aph-ear .w path, .aph-ear .loose path { transform-box: fill-box; }
.aph-ear:hover .w path, .aph-ear:focus-visible .w path { animation: aph-stir 1.7s ease-in-out infinite alternate; }
.aph-ear:hover .w2 path, .aph-ear:focus-visible .w2 path { animation-duration: 1.3s; animation-delay: -.4s; }
.aph-ear:hover .w3 path, .aph-ear:focus-visible .w3 path { animation-duration: 2.1s; animation-delay: -.9s; }
.aph-ear:hover .loose path { animation: aph-stir 1.9s ease-in-out infinite alternate; }
.aph-still-ear * { transition: none !important; }
@keyframes aph-stir { 0% { transform: translate(0, 0); } 30% { transform: translate(.45px, -.3px); } 65% { transform: translate(-.3px, .35px); } 100% { transform: translate(.25px, .15px); } }
.aph-ear:hover .w path + path, .aph-ear:focus-visible .w path + path { animation-direction: alternate-reverse; animation-duration: 1.45s; }

/* ================= browser defaults =================
   Everything the browser would draw in its own colours is brought into the system here: selection, scrollbars,
   caret, native controls, autofill, placeholders, markers, backdrops. Tokens only, both themes. See "Browser
   defaults" in system/README.md for each rule and for what the OS still draws itself. */

/* the theme the system draws its own controls in follows data-theme, like tokens.css; --aph-veil is the share of
   accent in the selection veil, chosen per theme so red ink on it stays above 4.5:1 and the veil stays visible */
:root { color-scheme: light; --aph-veil: 16%; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --aph-veil: 28%; } }
:root[data-theme="dark"] { color-scheme: dark; --aph-veil: 28%; }
:root[data-theme="light"] { color-scheme: light; --aph-veil: 16%; }

/* the ground reaches past the page: rubber-band and overscroll on iOS show bg, never white */
html { background: var(--bg); -webkit-tap-highlight-color: transparent; caret-color: var(--accent); accent-color: var(--accent); }
input, textarea, select, progress, meter, [contenteditable] { caret-color: var(--accent); accent-color: var(--accent); }

/* selection: red ink on a faint veil of red, never the system blue. Scroll-to-text highlights read the same. */
::selection { color: var(--accent-text); background: color-mix(in oklch, var(--accent) var(--aph-veil), transparent); text-shadow: none; -webkit-text-fill-color: var(--accent-text); }
::target-text { color: var(--accent-text); background: color-mix(in oklch, var(--accent) var(--aph-veil), transparent); }
/* during the eye's wave, selected text in .aph-ink is the white ink like the rest (the negative of the cell beneath
   it), on the veil in the shift grey: red under difference would read as cyan */
.aph-shifting .aph-ink::selection, .aph-shifting .aph-ink ::selection { color: var(--ink); -webkit-text-fill-color: var(--ink); }
/* the canvas cells and the drawn marks never take a selection veil */
svg ::selection, canvas::selection { background: transparent; }

/* scrollbars. Firefox (and any engine without the WebKit pseudo-elements) draws the standard thin bar in soft ink.
   The standard properties stay out of WebKit and Blink on purpose: once scrollbar-width or scrollbar-color is set
   on an element, Chromium ignores ::-webkit-scrollbar for it, and the stipple below is lost. */
@supports not selector(::-webkit-scrollbar) {
  * { scrollbar-width: thin; scrollbar-color: color-mix(in oklch, var(--ink-soft) 55%, transparent) transparent; }
}
/* Chromium and Safari: a thin, empty track and a thumb made of stipple: 2px square cells in soft ink, laid by four
   grids whose periods never line up, so the cells read as scattered rather than ruled. Hover adds two more grids. */
::-webkit-scrollbar { width: 8px; height: 8px; background: transparent; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-track-piece, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
::-webkit-scrollbar-thumb {
  --c: color-mix(in oklch, var(--ink-soft) 80%, transparent);
  border: 0; border-radius: var(--radius-none);
  background-color: transparent;
  background-image:
    conic-gradient(at 2px 2px, transparent 75%, var(--c) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--c) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--c) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--c) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--c) 0);
  background-size: 8px 6px, 8px 10px, 8px 14px, 8px 22px, 8px 18px;
  background-position: 0 0, 4px 4px, 6px 8px, 2px 12px, 4px 16px;
}
::-webkit-scrollbar-thumb:horizontal {
  background-size: 6px 8px, 10px 8px, 14px 8px, 22px 8px, 18px 8px;
  background-position: 0 0, 4px 4px, 8px 6px, 12px 2px, 16px 4px;
}
::-webkit-scrollbar-thumb:hover, ::-webkit-scrollbar-thumb:active {
  --c: var(--ink-soft);
  background-image:
    conic-gradient(at 2px 2px, transparent 75%, var(--c) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--c) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--c) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--c) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--c) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--c) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--c) 0);
  background-size: 8px 6px, 8px 10px, 8px 14px, 8px 22px, 8px 18px, 8px 8px, 8px 12px;
  background-position: 0 0, 4px 4px, 6px 8px, 2px 12px, 4px 16px, 2px 2px, 6px 0;
}
::-webkit-scrollbar-thumb:horizontal:hover, ::-webkit-scrollbar-thumb:horizontal:active {
  background-size: 6px 8px, 10px 8px, 14px 8px, 22px 8px, 18px 8px, 8px 8px, 12px 8px;
  background-position: 0 0, 4px 4px, 8px 6px, 12px 2px, 16px 4px, 2px 2px, 0 6px;
}

/* interactive marks: the seal, the eye, the ear, the experimental door, canvases, controls drawn as brush or
   stipple. A long press there does nothing (no iOS callout, no selection). Text and links keep the normal behaviour. */
.aph-mark, [data-aph-mark], .aph-ear, canvas { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }

/* autofill keeps the ground and the ink: the browser's tint is held off by a transition that never finishes, and
   painted over with the ground where it is not (Firefox). The brushed baseline sits outside the field and stays. */
input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus,
textarea:-webkit-autofill, select:-webkit-autofill {
  -webkit-text-fill-color: var(--ink); caret-color: var(--accent);
  -webkit-box-shadow: 0 0 0 100vmax var(--bg) inset; box-shadow: 0 0 0 100vmax var(--bg) inset;
  transition: background-color 600000s 0s, color 600000s 0s;
}
input:autofill, textarea:autofill, select:autofill {
  -webkit-text-fill-color: var(--ink); caret-color: var(--accent); filter: none;
  box-shadow: 0 0 0 100vmax var(--bg) inset;
}

/* placeholders: soft ink, lowercase, like every label */
::placeholder { color: var(--ink-soft); opacity: 1; text-transform: lowercase; }

/* file inputs: the button is a label in the site's voice, with no box */
input[type="file"] { color: var(--ink-soft); font: 400 11px/1.6 var(--font-text); letter-spacing: .14em; text-transform: lowercase; }
::file-selector-button {
  -webkit-appearance: none; appearance: none; background: none; border: 0; border-radius: var(--radius-none);
  margin: 0 var(--space-3) 0 0; padding: var(--space-2) 0; color: var(--ink);
  font: 400 13px/1 var(--font-text); letter-spacing: .22em; text-transform: lowercase; cursor: pointer;
  transition: color var(--duration-slow) var(--easing-settle);
}
::file-selector-button:hover { color: var(--accent-text); }

/* range inputs: a brushed track (tapered ends, ink that thins and thickens along it) and a thumb of stipple in accent */
input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; height: 28px; margin: 0; }
/* the taper is an ellipse as long as the track, so both ends thin to a point; the ink drifts thinner in two places.
   No clip-path or mask here: they would clip the thumb, which is drawn inside the track. */
input[type="range"]::-webkit-slider-runnable-track {
  height: 4px; border: 0; border-radius: var(--radius-none);
  background:
    linear-gradient(90deg, transparent 8%, color-mix(in oklch, var(--bg) 30%, transparent) 21%, transparent 33%, transparent 57%,
      color-mix(in oklch, var(--bg) 22%, transparent) 69%, transparent 80%),
    radial-gradient(closest-side, var(--ink-soft) 72%, color-mix(in oklch, var(--ink-soft) 45%, transparent) 90%, transparent);
}
input[type="range"]::-moz-range-track {
  height: 4px; border: 0; border-radius: var(--radius-none);
  background:
    linear-gradient(90deg, transparent 8%, color-mix(in oklch, var(--bg) 30%, transparent) 21%, transparent 33%, transparent 57%,
      color-mix(in oklch, var(--bg) 22%, transparent) 69%, transparent 80%),
    radial-gradient(closest-side, var(--ink-soft) 72%, color-mix(in oklch, var(--ink-soft) 45%, transparent) 90%, transparent);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 16px; height: 16px; margin-top: -6px; border: 0; border-radius: var(--radius-none);
  background-color: transparent;
  background-image:
    conic-gradient(at 2px 2px, transparent 75%, var(--accent) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--accent) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--accent) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--accent) 0);
  background-size: 4px 4px, 6px 10px, 10px 6px, 8px 14px;
  background-position: 0 0, 2px 2px, 2px 0, 6px 6px;
}
input[type="range"]::-moz-range-thumb {
  width: 16px; height: 16px; border: 0; border-radius: var(--radius-none);
  background-color: transparent;
  background-image:
    conic-gradient(at 2px 2px, transparent 75%, var(--accent) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--accent) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--accent) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--accent) 0);
  background-size: 4px 4px, 6px 10px, 10px 6px, 8px 14px;
  background-position: 0 0, 2px 2px, 2px 0, 6px 6px;
}

/* search inputs: no cancel cross, no magnifier, no results button; the field is a line of text like any other */
input[type="search"] { -webkit-appearance: none; appearance: none; }
input[type="search"]::-webkit-search-decoration, input[type="search"]::-webkit-search-cancel-button,
input[type="search"]::-webkit-search-results-button, input[type="search"]::-webkit-search-results-decoration { -webkit-appearance: none; appearance: none; display: none; }

/* native elements, should they appear */
::marker { color: var(--ink-soft); }
summary { cursor: pointer; }
summary::marker, summary::-webkit-details-marker { color: var(--ink-soft); }
dialog { background: transparent; color: var(--ink); border: 0; border-radius: var(--radius-none); }
dialog::backdrop { background: color-mix(in oklch, var(--bg) 78%, transparent); }
::cue { color: var(--ink); background: color-mix(in oklch, var(--bg) 72%, transparent); font-family: var(--font-text); }
/* works · opera
   layout: one screen, two views in the same place. the list is one quiet inscription line drawn with the brush,
   under the section title; each work is a grain on the line, its name above in the text face and its gloss below
   in Aphesis Script. two works face each other across the middle like a diptych; more spread along the same line,
   and when they no longer fit across the screen the line turns and runs down it. choosing a work dissolves the
   line and shows the work alone: its simulacrum on one side, its name, words, meta and links on the other (on a
   phone, one above the other). the seal holds the top-left corner, the eye the bottom-left, the passage corner
   stays free. */

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
  font: var(--type-body-weight) var(--type-body-size)/var(--type-body-line) var(--font-text);
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-theme) var(--easing-settle), color var(--duration-theme) var(--easing-settle);
}
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; border-radius: var(--radius-none); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#fog { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: var(--z-fog); pointer-events: none; }

#seal {
  position: fixed; z-index: var(--z-seal); display: block; color: var(--seal);
  left: calc(var(--space-4) + env(safe-area-inset-left, 0px)); top: calc(var(--space-4) + env(safe-area-inset-top, 0px));
  height: 64px; width: calc(64px * 385 / 533);
}

/* ---------- views ---------- */
/* both views stand in the same place. Each piece of text and each mark (.enter) runs its own blur and rise, so no
   parent is ever filtered or faded: a filter or opacity on a parent would isolate the .aph-ink text in it from the
   fog, and it would vanish into the old ground while the theme shifts. The view itself only turns visible, and
   stays visible after leaving long enough for its pieces to go (--leave; the work also waits for its simulacrum
   to dissolve). */
.view {
  /* absolute with no z-index, not fixed: the view must not be a stacking context of its own, so the .aph-ink text in
     it can blend with the fog beneath while the theme shifts. It paints over the fog by document order. */
  position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
  padding-left: max(var(--space-4), calc(var(--space-3) + env(safe-area-inset-left, 0px)));
  padding-right: max(var(--space-4), calc(var(--space-3) + env(safe-area-inset-right, 0px)));
  padding-top: calc(var(--space-7) + env(safe-area-inset-top, 0px));
  padding-bottom: calc(var(--space-7) + env(safe-area-inset-bottom, 0px));
  visibility: hidden; transition: visibility 0s linear var(--leave, var(--duration-scene));
  text-shadow: 0 0 4px var(--bg), 0 0 10px var(--bg), 0 0 18px var(--bg);
}
.view.on { visibility: visible; transition-delay: 0s; }
/* the halo is declared again on the .aph-ink text itself, so it reads the --bg the theme shift sets there (black,
   which a difference blend leaves unseen) instead of inheriting the view's */
.view .aph-ink { text-shadow: 0 0 4px var(--bg), 0 0 10px var(--bg), 0 0 18px var(--bg); }
#work { --leave: 2s; }
.enter {
  opacity: 0; filter: blur(10px); transform: translateY(14px);
  transition: opacity var(--duration-scene) var(--easing-settle), filter var(--duration-scene) var(--easing-settle),
              transform var(--duration-scene) var(--easing-settle), color var(--duration-slow) var(--easing-settle);
}
.view.on .enter { opacity: 1; filter: none; transform: none; }
/* the leaving view goes a little faster, so the two never read as one */
.view:not(.on) .enter { transition-duration: calc(var(--duration-scene) * .6); }

/* the title: its gloss above it */
.head { margin: 0; font-weight: 400; }
/* a title takes focus when its view opens: no ring for a click or a tap, the system's hairline for the keyboard */
.head:focus:not(:focus-visible) { outline: none; }
.head .gloss-title {
  display: block; margin-bottom: var(--space-3);
  font: var(--type-gloss-title-weight) var(--type-gloss-title-size)/var(--type-gloss-title-line) var(--font-display);
  letter-spacing: var(--type-gloss-title-tracking); font-variation-settings: "wght" 400, "slnt" -12;
  color: var(--ink-soft); text-transform: lowercase;
}
.head .title {
  display: block; padding-right: .2em; text-wrap: balance;
  font: var(--type-title-weight) clamp(44px, 8vw, 96px)/var(--type-title-line) var(--font-display);
  font-variation-settings: "wght" 400, "slnt" -12; text-transform: lowercase;
}

/* ---------- the list: one inscription line ---------- */
#list { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-6); }
#list .head { text-align: center; }
#inscription { position: relative; width: min(880px, 100%); }
#inscription .line { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; color: var(--line); }
#inscription .line path { fill: currentColor; opacity: 0; transition: opacity var(--duration-scene) var(--easing-settle) .2s; }
#inscription.drawn .line path { opacity: 1; }
#names { list-style: none; margin: 0; padding: 0; display: flex; justify-content: space-around; gap: var(--space-4); }
#names li { flex: 1 1 0; min-width: 0; display: flex; justify-content: center; }

.work {
  display: grid; grid-template-areas: "name" "node" "gl"; justify-items: center; row-gap: var(--space-3);
  padding: var(--space-3) var(--space-4); text-decoration: none; color: var(--ink);
}
.work .name {
  grid-area: name; white-space: nowrap;
  font-size: var(--type-label-size); line-height: var(--type-label-line); letter-spacing: var(--type-label-tracking); text-transform: lowercase;
}
.work .node { grid-area: node; width: 24px; height: 24px; display: block; color: var(--ink-soft); }
.work .node svg { width: 100%; height: 100%; display: block; overflow: visible; }
.work .node path { fill: currentColor; }
.work .gl {
  grid-area: gl; white-space: nowrap; padding-right: .2em;
  font: var(--type-gloss-weight) var(--type-gloss-size)/var(--type-gloss-line) var(--font-display);
  font-variation-settings: "wght" 400, "slnt" -12; letter-spacing: .02em; color: var(--ink-soft); text-transform: lowercase;
}
.work:hover .gl, .work:focus-visible .gl { color: var(--accent-text); }
.work:hover .node, .work:focus-visible .node { color: var(--accent); }

/* when the works no longer fit across, the line runs down the screen and the names stand to its right */
#inscription.stack { width: min(420px, 100%); }
#inscription.stack #names { flex-direction: column; gap: var(--space-4); }
#inscription.stack #names li { justify-content: flex-start; }
#inscription.stack .work { grid-template-areas: "node name" "node gl"; grid-template-columns: auto 1fr; justify-items: start; column-gap: var(--space-4); row-gap: var(--space-2); align-items: center; }
#inscription.stack .work .node { align-self: center; }

/* ---------- one work ---------- */
#work {
  display: grid; grid-template-columns: minmax(0, 36rem) minmax(0, 30rem); align-items: center; align-content: center;
  justify-content: center; column-gap: var(--space-7); row-gap: var(--space-5);
}
#figure { position: relative; margin: 0; height: min(62vh, 600px); min-height: 220px; min-width: 0; }
#picture {
  position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  opacity: 0; transition: opacity var(--duration-scene) var(--easing-settle);
}
#picture.on { opacity: 1; }
#caption {
  position: absolute; right: 0; bottom: calc(-1 * var(--space-4)); margin: 0; max-width: 100%; text-align: right; text-transform: lowercase;
  opacity: 0; transition: opacity var(--duration-scene) var(--easing-settle);
}
#caption.on { opacity: 1; transition-delay: .4s; }
#text { min-width: 0; max-width: 34rem; display: flex; flex-direction: column; gap: var(--space-4); }
#text .desc { margin: 0; max-width: 60ch; }
#text .meta { margin: 0; letter-spacing: var(--type-meta-tracking); text-transform: lowercase; }
#text .meta .sep { margin: 0 .6em; }
.links { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-5); }

/* links out and the ways back: text in the label style over a brushed underline; nothing solid */
.ul, .way {
  position: relative; display: inline-block; padding: var(--space-2) 0 var(--space-3); text-decoration: none;
  font-size: var(--type-label-size); line-height: var(--type-label-line); letter-spacing: var(--type-label-tracking); text-transform: lowercase;
}
.ul { color: var(--ink); }
.ul svg, .way svg { position: absolute; left: 0; bottom: 2px; height: 8px; overflow: visible; pointer-events: none; color: var(--ink-soft); transition: color var(--duration-slow) var(--easing-settle); }
.ul svg path, .way svg path { fill: currentColor; }
.ul:hover, .ul:focus-visible { color: var(--accent-text); }
.ul:hover svg, .ul:focus-visible svg, .way:hover svg, .way:focus-visible svg { color: var(--accent); }
.ways { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: var(--space-2) var(--space-6); margin-top: var(--space-3); }
.way { color: var(--ink-soft); }
.way:hover, .way:focus-visible { color: var(--accent-text); }

@media (max-width: 760px), (max-height: 520px) {
  /* the text scrolls between the corners: it dissolves before it reaches the seal, the eye and ear and the passage,
     and ends above them. The mask would isolate the text from the fog, so it gives way while the eye's wave runs */
  .view {
    padding-top: calc(var(--space-7) + var(--space-6) + env(safe-area-inset-top, 0px));

M["content.js"] = (function () {
/* content: where the works come from when the content service answers. The build writes the API's base URL here
   (build.py --content-api URL, or APHESIS_CONTENT_API); without one, the page keeps the works it was built with.
   A work from the API has the fields of content/works.json; its map is loaded here into a canvas, the form the
   simulacrum takes reliably on every GPU, from the API's own picture URL. */

const CONTENT_API = "";

function load(url) {
  return new Promise((resolve) => {
    const im = new Image();
    im.crossOrigin = 'anonymous';   /* the content API serves its pictures with CORS */
    im.onload = () => { const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight; c.getContext('2d').drawImage(im, 0, 0); resolve(c); };
    im.onerror = () => resolve(null);
    im.src = url;
  });
}

/* {works, maps} or null when the service is not set, slow or empty (the page waits at most `timeout` ms) */
async function fetchWorks(timeout = 3000) {
  if (!CONTENT_API) return null;
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const t = setTimeout(() => ctl && ctl.abort(), timeout);
  try {
    const r = await fetch(CONTENT_API.replace(/\/+$/, '') + '/v1/works', { signal: ctl && ctl.signal, credentials: 'omit' });
    if (!r.ok) return null;
    const data = await r.json();
    if (!Array.isArray(data.works) || !data.works.length) return null;

/* ---- marks.js ---- */

/* ---- theme.js ---- */
M["theme.js"] = (function () {
/* theme: the system's setting until the eye says otherwise. Open eye = light, closed eye = dark. */

const A = window.Aphesis;

const isDark = () => (root.dataset.theme ? root.dataset.theme === 'dark' : sysDark.matches);

function createEye(button) {
  button.querySelector('.eye.open').innerHTML = A.icon('eye', 0);
  button.querySelector('.eye.closed').innerHTML = A.icon('eye', 1);
  const state = () => {
    root.classList.toggle('is-dark', isDark());
    button.dataset.tip = isDark() ? 'closed · open the eye' : 'open · close the eye';
    button.setAttribute('aria-pressed', String(isDark()));
  };

  sysDark.addEventListener('change', state);

/* ---- picture.js ---- */
M["picture.js"] = (function () {
/* picture: the one simulacrum canvas of the section, reused for every work. It lies over the fog with no ground
   of its own (ground: false), so only its cells show. The canvas stays invisible until its first frame is drawn,
   and rests (stop) once it has dissolved, so the fog is the only thing drawing while the list is shown.

   show(work, src): coalesce the work out of the fog (2.6 s). If another work is still on the canvas, it dissolves
   first and the new one gathers in its place (Simulacrum.set), so two pictures never mix.

  let token = 0, rest = 0;

  function reveal(t) { s.drawn(() => { if (t === token) canvas.classList.add('on'); }); }

  return {
    show(work, src) {
      const t = ++token; clearTimeout(rest);
      const source = Object.assign({ src }, work.map.settings || {});
      caption.classList.remove('on');
      s.start(); reveal(t);
      /* the caption arrives once the picture has begun to gather: at once, or after the old one has dissolved */
      const swap = onCanvas !== work.id && gathered;
      if (onCanvas === work.id) s.show(null); else if (swap) s.set(source); else s.show(source);
      onCanvas = work.id; gathered = true;

      caption.classList.remove('on');

})();
/* ---- inscription.js ---- */
M["inscription.js"] = (function () {
/* inscription: the list of works as one line drawn with the brush. Each work is a grain on the line, its name
   above it in the text face and its gloss below in Aphesis Script. The works share the width evenly: two face
   each other across the middle, more spread along the same line. When they no longer fit across, the line turns
   and runs down the screen, with the names to its right. The order is the order of content/works.json. */

  const list = nav.querySelector('#names'), svg = nav.querySelector('.line');

    const li = document.createElement('li');
    const a = document.createElement('a');
    a.className = 'work aph-wave'; a.href = '#works-' + w.id; a.dataset.id = w.id;
    a.innerHTML = '<span class="name enter aph-ink"></span><span class="node enter"></span><span class="gl enter" lang=""></span>';
    a.querySelector('.name').textContent = w.name;
    a.querySelector('.node').innerHTML = grain(seedOf(w.id));
    const gl = a.querySelector('.gl');
    gl.textContent = w.gloss;
    gl.lang = /[Ͱ-Ͽἀ-῿]/.test(w.gloss) ? 'grc' : 'la';

/* ---- work.js ---- */
M["work.js"] = (function () {
/* work: one work shown alone. Its gloss above its name in Aphesis Script, a short description, the year and the

function createWork(els, works) {

})();
/* ---- main.js ---- */
M["main.js"] = (function () {
/* works · opera, as it will stand inside the site: the fog thinned for a section, the seal in the corner, the eye
   in the bottom-left, the passage corner kept free, the runtime's cursor and tooltip.

   Two views in one place, chosen by the hash: #works (or anything else) shows the inscription of works,
   #works-<id> shows that work alone. Links, the back button of the browser, Escape and the arrow keys all
   change the hash, and only the hash changes the view. */

const { SCENE, step } = M["motion.js"];
const { createEye } = M["theme.js"];
const { createPicture } = M["picture.js"];
const { createInscription } = M["inscription.js"];
const { createWork } = M["work.js"];

const $ = (id) => document.getElementById(id);

const fog = A.Fog($('fog'), { density: 0.62, light: 0.4 });
A.seal($('seal'));
A.cursor();

const announceEl = $('announce');

  }, works);

      leave(listView);

}

})();
})();
