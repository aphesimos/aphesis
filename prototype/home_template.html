   sections as an inscription around the seal, the passage of the day in the bottom-right corner. */
:root{

  --n-50:oklch(0.975 0.003 25); --n-100:oklch(0.95 0.004 25); --n-150:oklch(0.92 0.005 25); --n-200:oklch(0.88 0.006 25);

  --n-700:oklch(0.40 0.008 25); --n-800:oklch(0.30 0.007 25); --n-850:oklch(0.25 0.006 25); --n-900:oklch(0.20 0.006 25);
  --n-950:oklch(0.15 0.005 25); --n-975:oklch(0.11 0.004 25);
  /* accent: rubedo red, only for the seal and moments of impact */
  --red:oklch(0.47 0.185 26); --red-text:oklch(0.45 0.18 26);
  /* roles */
  --bg:var(--n-100); --ink:var(--n-900); --ink-soft:var(--n-600); --line:var(--n-300); --fog:var(--n-900);
  --seal:var(--red); --accent:var(--red); --accent-text:var(--red-text);
  /* two faces only (design system): Aphesis Script for the wordmark, titles and glosses; Special Elite for text */

  color-scheme:light;
}

/* ---------- Typist: types a line like a person would ----------
   rhythm: each keystroke varies around a base pace (log-normal), slower at the start of a word, after a space,
   on capitals (the shift key) and after punctuation. errors: now and then a neighbouring key is hit; the typist
   keeps going for a letter or two, notices, pauses, deletes and retypes. once in a while it rethinks: stops at a
   word boundary, deletes the last word and writes it again. the caret is solid while typing, blinks when idle,
   and fades when the line is done. */
const Typist=(function(){
  const ROWS=['qwertyuiop','asdfghjkl','zxcvbnm'];
  const NEAR={}; ROWS.forEach((r,y)=>[...r].forEach((c,x)=>{const n=[];

      if(Math.random()<0.03) d+=200+Math.random()*380; // a small hesitation

    constructor(el,caret){this.el=el;this.caret=caret;this.t=null;this.buf=[];}
    stop(){clearTimeout(this.t);}

/* ---------- icons: drawn with the φ's brush (see the design system) ---------- */
/* ---------- brush: a centerline + width profile becomes a filled outline (tapered both ends, slight wobble) ---------- */
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}

  const r=rng(seed), n=pts.length, L=[],R=[]; const ph=[r()*6,r()*6,r()*6];

    L.push([pts[i][0]-ty*wl/2,pts[i][1]+tx*wl/2]); R.push([pts[i][0]+ty*wr/2,pts[i][1]-tx*wr/2]);}
  const f=v=>v.toFixed(2); let d='M'+f(L[0][0])+' '+f(L[0][1]); for(let i=1;i<n;i++) d+='L'+f(L[i][0])+' '+f(L[i][1]); for(let i=n-1;i>=0;i--) d+='L'+f(R[i][0])+' '+f(R[i][1]); return d+'Z';

const arc=(cx,cy,r,a0,a1,n=64,ry)=>{const p=[];for(let i=0;i<=n;i++){const a=(a0+(a1-a0)*i/n)*Math.PI/180;p.push([cx+r*Math.cos(a),cy+(ry||r)*Math.sin(a)]);}return p;};

/* stipple: dots inside a region, density by a function; deterministic */
function stipple(test,seed,count,size=0.42){const r=rng(seed);let d='';for(let i=0;i<count;i++){const x=r()*24,y=r()*24;if(test(x,y)){const s=size*(0.7+r()*0.6);d+=`M${(x-s/2).toFixed(2)} ${(y-s/2).toFixed(2)}h${s.toFixed(2)}v${s.toFixed(2)}h${(-s).toFixed(2)}z`;}}return d;}

/* ---------- theme shift (the same as Aphesis.themeShift in the design system's runtime) ---------- */
const cssColor=cssRGB;
  /* ================= THEME SHIFT ================= */
  /* themeShift(apply, {origin, cell, fill, clear}): the change of theme as a stipple wave.
     From the origin (the eye), square cells spread across the screen in the new theme's ground; in fog-shaped clumps
     some of them are laid down as the new theme's fog points instead. When the wave is complete the screen already
     looks like the new theme's fog: only then is the theme applied underneath (apply()), and the overlay melts away
     while the real fog takes over its points. apply() must switch the theme (e.g. set data-theme). */
  var shifting = false;
  function themeShift(apply, o) {
    o = o || {};
    if (shifting) return; shifting = true;
    var root = document.documentElement, before = root.getAttribute('data-theme');
    /* read the new theme's colours without painting it: switch, read, switch back, all in one frame */
    var dark = before ? before === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches, next = dark ? 'light' : 'dark';
    root.setAttribute('data-theme', next); var BG = cssColor('--bg'), FG = cssColor('--fog');
    if (before) root.setAttribute('data-theme', before); else root.removeAttribute('data-theme');
    var cell = o.cell || 2, W = Math.ceil(innerWidth / cell), H = Math.ceil(innerHeight / cell);
    var cv = document.createElement('canvas'); cv.width = W; cv.height = H; cv.setAttribute('aria-hidden', 'true');
    cv.style.cssText = 'position:fixed;left:0;top:0;width:' + (W * cell) + 'px;height:' + (H * cell) + 'px;z-index:18;pointer-events:none;image-rendering:pixelated';
    document.body.appendChild(cv);
    var x = cv.getContext('2d'), img = x.createImageData(W, H), px = img.data;
    var org = o.origin || [24, innerHeight - 24], ox = org[0] / cell, oy = org[1] / cell;
    var far = Math.max(Math.hypot(ox, oy), Math.hypot(W - ox, oy), Math.hypot(ox, H - oy), Math.hypot(W - ox, H - oy));
    /* per cell: when it turns (distance from the eye, loosened by a hash) and what it becomes (ground or a fog point) */
    var at = new Float32Array(W * H), dot = new Uint8Array(W * H), r = rng(97);
    var g = [], GS = 28, gw = Math.ceil(W / GS) + 2, gh = Math.ceil(H / GS) + 2;
    for (var i = 0; i < gw * gh; i++) g.push(r());
    function vn(cx, cy) { var X = cx / GS, Y = cy / GS, x0 = Math.floor(X), y0 = Math.floor(Y), fx = X - x0, fy = Y - y0; fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);

    function frame(now) {

        else px[j + 3] = 0;

      /* the screen is the new theme's fog: apply the theme beneath it, let the real fog paint, then melt away */
      apply();

        cv.style.transition = 'opacity ' + clear + 'ms cubic-bezier(.2,.7,.2,1)'; cv.style.opacity = '0';

  }
