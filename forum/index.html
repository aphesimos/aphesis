/* aphes.ist components. Every value comes from tokens.css (generated from tokens.json). */
/* two faces only. Aphesis Script (fonts/, a file): the wordmark, titles and glosses, and every Greek or CJK
   character. Special Elite (Google Fonts): everything people read and operate; it falls back to Aphesis Script
   for the scripts it lacks. */
body { background: var(--bg); color: var(--ink); font-family: var(--font-text); }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }

/* tooltip: page ground, a hairline of accent on the left, small text typed fast */
.aph-tip {
  position: fixed; left: 0; top: 0; z-index: var(--z-tip); pointer-events: none;
  max-width: min(320px, calc(100vw - 32px)); padding: var(--space-2) var(--space-3);
  background: var(--bg); color: var(--ink-soft); border-left: 1px solid var(--accent);
  font: 400 11px/1.6 var(--font-text); letter-spacing: .06em;
  opacity: 0; filter: blur(4px); transform: translateY(4px);
  transition: opacity var(--duration-quick) ease, filter var(--duration-quick) ease, transform var(--duration-quick) var(--easing-settle);
}
.aph-tip.on { opacity: 1; filter: none; transform: none; }

/* cursor: a white disc in difference blend, the negative of whatever it covers */
@media (hover: hover) and (pointer: fine) {
  .aph-has-cursor, .aph-has-cursor *, .aph-has-cursor *::before, .aph-has-cursor *::after { cursor: none !important; }
}
.aph-cursor {
  position: fixed; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: var(--radius-disc);
  background: #fff; mix-blend-mode: difference; pointer-events: none; z-index: var(--z-cursor);
  transform: translate(-100px, -100px) scale(.2); opacity: 0; transition: opacity var(--duration-quick) ease;
}
.aph-cursor.on { opacity: 1; }

/* letter wave: letters lift a hair, one after another; nothing around them moves */
.ltr { display: inline-block; transition: transform var(--duration-slow) var(--easing-settle); transition-delay: calc(var(--i) * 22ms); }
.aph-wave:hover .ltr, .aph-wave:focus-visible .ltr { transform: translateY(-2px); }

/* masked text: one round grain of stipple per hidden character (Aphesis.grain, Aphesis.grains), in ink, never squares
   or bullets; --grain-size and --grain-gap shrink it where a line must hold more */
.aph-grains { display: inline-flex; align-items: center; gap: var(--grain-gap, 4px); color: var(--ink); vertical-align: middle; }
.aph-grain { display: block; flex: none; width: var(--grain-size, 14px); height: var(--grain-size, 14px); }
.aph-grain path { fill: currentColor; }
/* typist caret: solid while typing, blinking when idle, fading when done */
.aph-caret { display: inline-block; width: .55em; height: 1.05em; margin-left: .12em; vertical-align: -.18em; background: currentColor; opacity: .75; }
.aph-caret.blink { animation: aph-blink 1.06s steps(1, end) infinite; }
.aph-caret.gone { opacity: 0; transition: opacity 1.2s ease; }
@keyframes aph-blink { 50% { opacity: 0; } }

/* type roles as classes (the same roles tokens.json lists) */
/* display text leans: titles and glosses take the slant axis at -12 (the φ stays upright on its own) */
.aph-display { font-family: var(--font-display); font-weight: 400; font-variation-settings: "wght" 400, "slnt" -12; text-transform: lowercase; line-height: .95; padding-right: .2em; }
.aph-gloss { font-family: var(--font-display); font-variation-settings: "wght" 400, "slnt" -12; letter-spacing: .02em; color: var(--ink-soft); text-transform: lowercase; }
.aph-label { font-family: var(--font-text); font-size: 13px; letter-spacing: .22em; text-transform: lowercase; }
.aph-meta { font-family: var(--font-text); font-size: 11px; letter-spacing: .14em; color: var(--ink-soft); }

/* text on fog keeps a halo of ground so it never sits on dots */
.aph-on-fog { text-shadow: 0 0 4px var(--bg), 0 0 10px var(--bg), 0 0 18px var(--bg); }


/* theme shift: the ground changes behind the page, cell by cell from the eye, and nothing on top stops.
   Mark the containers of black-and-white text with .aph-ink (not ones holding the seal, accents or their own ground):
   while the wave runs they blend by difference with white ink, so every glyph is the negative of the cell beneath it,
   old theme or new. Greys and hairlines get the one grey that reads right on both grounds. */
.aph-shifting .aph-ink {
  mix-blend-mode: difference; color: #fff;
  --ink: #fff; --fog: #fff; --ink-soft: var(--shift-soft); --line: var(--shift-line); --bg: #000;
  --accent: var(--shift-soft); --accent-text: var(--shift-soft);
}
/* the two frames around each switch: colours change without a transition (movement keeps its own) */
.aph-still body, .aph-still .aph-ink, .aph-still .aph-ink * { transition-property: opacity, filter, transform !important; }
/* the reds. Mark with .aph-red each red mark that is not text in an .aph-ink container: the seal, an icon, the eye, the
   ear, red words. While the wave runs it keeps the old theme's reds until the wave reaches where it stands, then turns
   to the new ones over half a second with minimum jerk (the keyframes are the curve). The runtime gives each its
   moment (--aph-red-at) and both themes' reds (--shift-accent-a, -b and the same for accent-text and seal). An element
   marked .aph-red carries no CSS animation of its own (mark its box), and a colour transition inside it is turned
   off while the wave runs (.aph-shifting), or it would trail the turn. */
@property --aph-red-k { syntax: '<number>'; inherits: false; initial-value: 1; }
/* the old reds are the rule's own value (k 0), not the animation's: before its turn the animation does nothing, so the
   element is left alone, and after it the end holds */
.aph-shifting .aph-red {
  --aph-red-k: 0;
  --accent: color-mix(in oklab, var(--shift-accent-a) calc(100% - 100% * var(--aph-red-k)), var(--shift-accent-b));
  --accent-text: color-mix(in oklab, var(--shift-accent-text-a) calc(100% - 100% * var(--aph-red-k)), var(--shift-accent-text-b));
  --seal: color-mix(in oklab, var(--shift-seal-a) calc(100% - 100% * var(--aph-red-k)), var(--shift-seal-b));
  animation: aph-red .5s linear var(--aph-red-at, 0ms) forwards;
}
@keyframes aph-red {
  0% { --aph-red-k: 0; } 10% { --aph-red-k: .00856; } 20% { --aph-red-k: .05792; } 30% { --aph-red-k: .16308; }
  40% { --aph-red-k: .31744; } 50% { --aph-red-k: .5; } 60% { --aph-red-k: .68256; } 70% { --aph-red-k: .83692; }
  80% { --aph-red-k: .94208; } 90% { --aph-red-k: .99144; } 100% { --aph-red-k: 1; }
}

/* the ear: the sound's switch, beside the eye. Listening, three arcs of stipple arrive at the ear and breathe with
   the level (--aph-lvl, set by the runtime); muted, they disperse and fall, and one stroke crosses the ear, drawn in
   from its end. Hovering stirs the points. */
.aph-ear { background: none; border: 0; padding: 6px; color: var(--accent); cursor: pointer; font: inherit; }
.aph-ear svg { width: 30px; height: 30px; display: block; overflow: visible; }
.aph-ear path { fill: currentColor; }
.aph-ear .w { opacity: calc(.6 + .4 * var(--aph-lvl, 1)); transform-origin: 9.6px 12.6px;
  transition: opacity var(--duration-slow) ease, transform 1.1s var(--easing-settle); }
.aph-ear .w2 { transition-delay: 60ms; } .aph-ear .w3 { transition-delay: 120ms; }
.aph-ear .slash { transform-origin: 4.2px 4.6px; transform: scale(0); transition: transform .9s var(--easing-settle); }
.aph-ear .loose { opacity: 0; transform: translate(-1.2px, -3px); transition: opacity var(--duration-slow) ease .25s, transform 1.1s var(--easing-settle) .2s; }
.aph-ear[aria-pressed="false"] .w { opacity: 0; transform: translate(2.2px, 1.6px) scale(1.16); }
.aph-ear[aria-pressed="false"] .w2 { transform: translate(2.8px, 2.6px) scale(1.12); }
.aph-ear[aria-pressed="false"] .w3 { transform: translate(3.2px, 3.6px) scale(1.08); }
.aph-ear[aria-pressed="false"] .slash { transform: none; transition-delay: .15s; }
.aph-ear[aria-pressed="false"] .loose { opacity: .7; transform: none; }
.aph-ear .w path, .aph-ear .loose path { transform-box: fill-box; }
.aph-ear:hover .w path, .aph-ear:focus-visible .w path { animation: aph-stir 1.7s ease-in-out infinite alternate; }
.aph-ear:hover .w2 path, .aph-ear:focus-visible .w2 path { animation-duration: 1.3s; animation-delay: -.4s; }
.aph-ear:hover .w3 path, .aph-ear:focus-visible .w3 path { animation-duration: 2.1s; animation-delay: -.9s; }
.aph-ear:hover .loose path { animation: aph-stir 1.9s ease-in-out infinite alternate; }
.aph-still-ear * { transition: none !important; }
@keyframes aph-stir { 0% { transform: translate(0, 0); } 30% { transform: translate(.45px, -.3px); } 65% { transform: translate(-.3px, .35px); } 100% { transform: translate(.25px, .15px); } }
.aph-ear:hover .w path + path, .aph-ear:focus-visible .w path + path { animation-direction: alternate-reverse; animation-duration: 1.45s; }

/* an icon in a control (Aphesis.icon inside .aph-icon, as the section icons sit on the phone's home): hovering or
   focusing stirs the stipple, its two halves against each other; .aph-gather draws the cells toward the icon's heart
   (the first tap on a section icon). Aphesis.icon(name, 1) is the same gathering, still, for places without motion. */
.aph-icon .aph-st { transition: transform var(--duration-slow) var(--easing-settle); }
.aph-icon .aph-st path { transform-box: fill-box; }
.aph-icon:hover .aph-st path, .aph-icon:focus-visible .aph-st path { animation: aph-stir 1.7s ease-in-out infinite alternate; }
.aph-icon:hover .aph-st path + path, .aph-icon:focus-visible .aph-st path + path { animation-direction: alternate-reverse; animation-duration: 1.45s; }
.aph-icon.aph-gather .aph-st { transform: scale(.8); }
/* the forum's three eyes: each a film of six drawings 24 units apart (0 rest, 1 and 2 other gazes, 3 half, 4 closed,
   5 on the centre). Hover runs the three films on their own rhythms at 8 fps in hard cuts (2s, 1.625s, 1.375s), so
   they never blink together; the hover ending returns them to rest. Gathering closes them and opens them on the centre. */
.aph-icon:hover .aph-film-a, .aph-icon:focus-visible .aph-film-a { animation: aph-eyes-a 2s step-end infinite; }
.aph-icon:hover .aph-film-b, .aph-icon:focus-visible .aph-film-b { animation: aph-eyes-b 1.625s step-end infinite; }
.aph-icon:hover .aph-film-c, .aph-icon:focus-visible .aph-film-c { animation: aph-eyes-c 1.375s step-end infinite; }
.aph-icon.aph-gather .aph-film { animation: aph-eyes-look .375s step-end forwards; }
@keyframes aph-eyes-a { 0% { transform: translateX(0); } 31.25% { transform: translateX(-24px); } 50% { transform: translateX(-72px); } 56.25% { transform: translateX(-96px); } 62.5% { transform: translateX(-72px); } 68.75% { transform: translateX(-24px); } 87.5% { transform: translateX(-48px); } 100% { transform: translateX(-48px); } }
@keyframes aph-eyes-b { 0% { transform: translateX(0); } 23.08% { transform: translateX(-48px); } 46.15% { transform: translateX(-24px); } 69.23% { transform: translateX(-72px); } 76.92% { transform: translateX(-96px); } 84.62% { transform: translateX(-72px); } 92.31% { transform: translateX(0); } 100% { transform: translateX(0); } }
@keyframes aph-eyes-c { 0% { transform: translateX(0); } 18.18% { transform: translateX(-72px); } 27.27% { transform: translateX(-96px); } 36.36% { transform: translateX(-72px); } 45.45% { transform: translateX(-24px); } 72.73% { transform: translateX(-48px); } 100% { transform: translateX(-48px); } }
@keyframes aph-eyes-look { 0% { transform: translateX(-96px); } 66.67% { transform: translateX(-120px); } 100% { transform: translateX(-120px); } }

/* ================= browser defaults =================
   Everything the browser would draw in its own colours is brought into the system here: scrollbars, selection,
   caret, focus, fields, autofill, placeholders, native controls, markers, dialogs, spelling marks, touch. Tokens
   only, both themes. Most rules are wrapped in :where(), so they weigh nothing and a screen's own rule always wins
   where it draws something better; the few marked !important are the ones a screen must never undo. See "Browser
   defaults" in system/README.md for each component, its states, the browsers that honour it, and what the OS still
   draws itself. */

/* the theme the system draws its own controls in follows data-theme, like tokens.css; --aph-veil is the share of
   accent in the selection veil, chosen per theme so red ink on it stays above 4.5:1 and the veil stays visible */
:root { color-scheme: light; --aph-veil: 16%; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --aph-veil: 28%; } }
:root[data-theme="dark"] { color-scheme: dark; --aph-veil: 28%; }
:root[data-theme="light"] { color-scheme: light; --aph-veil: 16%; }

/* the ground reaches past the page: rubber-band and overscroll on iOS show bg, never white. Text keeps its size
   when a phone turns. */
html { background: var(--bg); -webkit-tap-highlight-color: transparent; caret-color: var(--accent); accent-color: var(--accent);
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
input, textarea, select, progress, meter, [contenteditable] { caret-color: var(--accent); accent-color: var(--accent); }

/* scrollbars: the browser's are hidden on every element, in every engine, and nothing may bring them back.
   Scrolling stays native; where something scrolls, the runtime draws a red disturbance in the stipple along its
   right edge while it moves (Aphesis.Scroll). Nothing is reserved for a bar, so no gutter and no layout shift. */
* { scrollbar-width: none !important; }
::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; background: transparent !important; }
.aph-scroll { position: fixed; left: 0; top: 0; z-index: var(--z-scroll, 2); pointer-events: none; image-rendering: pixelated; }
.aph-scroll-drag, .aph-scroll-drag * { -webkit-user-select: none !important; user-select: none !important; }

/* selection: red ink on a faint veil of red, never the system blue. Scroll-to-text highlights read the same. */
::selection { color: var(--accent-text); background: color-mix(in oklch, var(--accent) var(--aph-veil), transparent); text-shadow: none; -webkit-text-fill-color: var(--accent-text); }
::target-text { color: var(--accent-text); background: color-mix(in oklch, var(--accent) var(--aph-veil), transparent); text-shadow: none; }
/* during the eye's wave, selected text in .aph-ink is the white ink like the rest (the negative of the cell beneath
   it), on the veil in the shift grey: red under difference would read as cyan */
.aph-shifting .aph-ink::selection, .aph-shifting .aph-ink ::selection { color: var(--ink); -webkit-text-fill-color: var(--ink); }
/* the canvas cells and the drawn marks never take a selection veil */
svg ::selection, canvas::selection { background: transparent; }

/* spelling and grammar marks (only in fields that ask for spellcheck): a dotted line of accent, stipple instead of
   the system's wavy red. Chromium only; elsewhere the OS draws its own. */
::spelling-error { color: inherit; background: transparent; text-decoration: underline dotted var(--accent) 2px; text-underline-offset: 3px; }
::grammar-error { color: inherit; background: transparent; text-decoration: underline dotted var(--ink-soft) 2px; text-underline-offset: 3px; }

/* focus: the red hairline, only for the keyboard */
:focus:not(:focus-visible) { outline: none; }

/* interactive marks: the seal, the eye, the ear, the experimental door, canvases, controls drawn as brush or
   stipple. A long press there does nothing (no iOS callout, no selection), and dragging lifts no ghost image.
   Text and links keep the normal behaviour. */
.aph-mark, [data-aph-mark], .aph-ear, canvas { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.aph-mark, [data-aph-mark], .aph-ear, canvas, svg, img { -webkit-user-drag: none; }

/* buttons and fields begin as words with no box: the browser's bevel, fill, border and system font are gone.
   :where() weighs nothing, so a screen's own rule always wins. */
:where(button, input, textarea, select) { font: inherit; letter-spacing: inherit; color: inherit; }
:where(button) { -webkit-appearance: none; appearance: none; background: none; border: 0; border-radius: var(--radius-none); cursor: pointer; }
:where(input:not([type="checkbox"], [type="radio"], [type="range"], [type="file"], [type="color"]), textarea, select) {
  -webkit-appearance: none; appearance: none; background: transparent; border: 0; border-radius: var(--radius-none);
}
/* a textarea's grip, where a screen leaves it resizable, is a few cells of soft ink in its corner */
::-webkit-resizer {
  background-color: transparent;
  background-image: linear-gradient(135deg, var(--bg) 50%, transparent 50%),
    conic-gradient(at 2px 2px, transparent 75%, var(--ink-soft) 0), conic-gradient(at 2px 2px, transparent 75%, var(--ink-soft) 0);
  background-size: 100% 100%, 4px 4px, 6px 6px; background-position: 0 0, 0 0, 2px 2px;
}

/* disabled: soft ink and the plain arrow, never the browser's greyed box or iOS's dimming. Ordinary weight, so it
   wins over a screen's colour for the control at rest (a class); a screen's own :disabled rule comes later and wins. */
button:disabled, input:disabled, textarea:disabled, select:disabled { color: var(--ink-soft); -webkit-text-fill-color: currentColor; opacity: 1; cursor: default; }

/* autofill keeps the ground and the ink: the browser's tint is held off by a transition that never finishes, and
   painted over with the ground where it is not (Firefox). The brushed baseline sits outside the field and stays.
   :where() lets a field that draws its own text (the gate's line, whose words are a mirror) keep it hidden. */
:where(input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus, textarea:-webkit-autofill, select:-webkit-autofill) {
  -webkit-text-fill-color: var(--ink); caret-color: var(--accent);
  -webkit-box-shadow: 0 0 0 100vmax var(--bg) inset; box-shadow: 0 0 0 100vmax var(--bg) inset;
  transition: background-color 600000s 0s, color 600000s 0s;
}
:where(input:autofill, textarea:autofill, select:autofill) {
  -webkit-text-fill-color: var(--ink); caret-color: var(--accent); filter: none;
  box-shadow: 0 0 0 100vmax var(--bg) inset;
}

/* placeholders: soft ink, lowercase, like every label */
::placeholder { color: var(--ink-soft); opacity: 1; text-transform: lowercase; -webkit-text-fill-color: var(--ink-soft); }

/* file inputs: the button is a label in the site's voice, with no box */
input[type="file"] { color: var(--ink-soft); font: 400 11px/1.6 var(--font-text); letter-spacing: .14em; text-transform: lowercase; }
::file-selector-button {
  -webkit-appearance: none; appearance: none; background: none; border: 0; border-radius: var(--radius-none);
  margin: 0 var(--space-3) 0 0; padding: var(--space-2) 0; color: var(--ink);
  font: 400 13px/1 var(--font-text); letter-spacing: .22em; text-transform: lowercase; cursor: pointer;
  transition: color var(--duration-slow) var(--easing-settle);
}
::file-selector-button:hover { color: var(--accent-text); }

/* checkboxes and radios, should they appear: a square of sparse soft-ink stipple at rest, filled with dense accent
   stipple when chosen. The radio is the same cells inside a circle. No box, no tick drawn by the OS. */
input[type="checkbox"], input[type="radio"] {
  -webkit-appearance: none; appearance: none; width: 14px; height: 14px; margin: 0 var(--space-2) 0 0; vertical-align: -2px;
  border: 0; border-radius: var(--radius-none); cursor: pointer; background-color: transparent;
  background-image:
    conic-gradient(at 2px 2px, transparent 75%, var(--ink-soft) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--ink-soft) 0);
  background-size: 6px 6px, 10px 4px; background-position: 0 0, 4px 2px;
}
input[type="radio"] { clip-path: circle(50%); }
input[type="checkbox"]:checked, input[type="radio"]:checked {
  background-image:
    conic-gradient(at 2px 2px, transparent 75%, var(--accent) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--accent) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--accent) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--accent) 0);
  background-size: 4px 4px, 6px 6px, 4px 6px, 6px 10px; background-position: 0 0, 2px 2px, 2px 0, 0 4px;
}
input[type="checkbox"]:indeterminate { background-image: conic-gradient(at 2px 2px, transparent 75%, var(--accent) 0); background-size: 4px 4px; background-position: 0 6px; background-repeat: repeat-x; }
input[type="checkbox"]:disabled, input[type="radio"]:disabled { opacity: .45; cursor: default; }

/* progress and meter, should they appear: an empty track and a value of accent stipple */
progress, meter { -webkit-appearance: none; appearance: none; height: 6px; border: 0; background: transparent; }
progress::-webkit-progress-bar, meter::-webkit-meter-bar { background: transparent; border: 0; }
/* (one rule per engine: a selector one engine does not know would drop the whole list) */
progress::-webkit-progress-value, meter::-webkit-meter-optimum-value, meter::-webkit-meter-suboptimum-value, meter::-webkit-meter-even-less-good-value {
  background-color: transparent;
  background-image: conic-gradient(at 2px 2px, transparent 75%, var(--accent) 0), conic-gradient(at 2px 2px, transparent 75%, var(--accent) 0);
  background-size: 4px 4px, 6px 6px; background-position: 0 0, 2px 2px;
}
progress::-moz-progress-bar {
  background-color: transparent;
  background-image: conic-gradient(at 2px 2px, transparent 75%, var(--accent) 0), conic-gradient(at 2px 2px, transparent 75%, var(--accent) 0);
  background-size: 4px 4px, 6px 6px; background-position: 0 0, 2px 2px;
}

/* range inputs: a brushed track (tapered ends, ink that thins and thickens along it) and a thumb of stipple in accent */
input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; height: 28px; margin: 0; }
/* the taper is an ellipse as long as the track, so both ends thin to a point; the ink drifts thinner in two places.
   No clip-path or mask here: they would clip the thumb, which is drawn inside the track. */
input[type="range"]::-webkit-slider-runnable-track {
  height: 4px; border: 0; border-radius: var(--radius-none);
  background:
    linear-gradient(90deg, transparent 8%, color-mix(in oklch, var(--bg) 30%, transparent) 21%, transparent 33%, transparent 57%,
      color-mix(in oklch, var(--bg) 22%, transparent) 69%, transparent 80%),
    radial-gradient(closest-side, var(--ink-soft) 72%, color-mix(in oklch, var(--ink-soft) 45%, transparent) 90%, transparent);
}
input[type="range"]::-moz-range-track {
  height: 4px; border: 0; border-radius: var(--radius-none);
  background:
    linear-gradient(90deg, transparent 8%, color-mix(in oklch, var(--bg) 30%, transparent) 21%, transparent 33%, transparent 57%,
      color-mix(in oklch, var(--bg) 22%, transparent) 69%, transparent 80%),
    radial-gradient(closest-side, var(--ink-soft) 72%, color-mix(in oklch, var(--ink-soft) 45%, transparent) 90%, transparent);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 16px; height: 16px; margin-top: -6px; border: 0; border-radius: var(--radius-none);
  background-color: transparent;
  background-image:
    conic-gradient(at 2px 2px, transparent 75%, var(--accent) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--accent) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--accent) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--accent) 0);
  background-size: 4px 4px, 6px 10px, 10px 6px, 8px 14px;
  background-position: 0 0, 2px 2px, 2px 0, 6px 6px;
}
input[type="range"]::-moz-range-thumb {
  width: 16px; height: 16px; border: 0; border-radius: var(--radius-none);
  background-color: transparent;
  background-image:
    conic-gradient(at 2px 2px, transparent 75%, var(--accent) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--accent) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--accent) 0),
    conic-gradient(at 2px 2px, transparent 75%, var(--accent) 0);
  background-size: 4px 4px, 6px 10px, 10px 6px, 8px 14px;
  background-position: 0 0, 2px 2px, 2px 0, 6px 6px;
}
input[type="range"]:disabled { opacity: .45; cursor: default; }

/* search inputs: no cancel cross, no magnifier, no results button; the field is a line of text like any other */
input[type="search"] { -webkit-appearance: none; appearance: none; }
input[type="search"]::-webkit-search-decoration, input[type="search"]::-webkit-search-cancel-button,
input[type="search"]::-webkit-search-results-button, input[type="search"]::-webkit-search-results-decoration { -webkit-appearance: none; appearance: none; display: none; }

/* number fields: no spinners; dates and datalists: no picker arrow (type dates as text, see the README) */
input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; appearance: none; margin: 0; display: none; }
input::-webkit-calendar-picker-indicator { display: none !important; }
/* Safari's key and contact buttons inside a field: the field stays a line of words (the password manager is still
   offered by the keyboard and the autofill bar) */
input::-webkit-credentials-auto-fill-button { visibility: hidden; pointer-events: none; }
input::-webkit-contacts-auto-fill-button { visibility: hidden; pointer-events: none; }
input::-webkit-caps-lock-indicator { display: none; }

/* native elements, should they appear */
::marker { color: var(--ink-soft); }
summary { cursor: pointer; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "· "; color: var(--accent); }
details[open] > summary::before { content: "∙ "; }
dialog { background: transparent; color: var(--ink); border: 0; border-radius: var(--radius-none); padding: 0; }
dialog::backdrop { background: color-mix(in oklch, var(--bg) 78%, transparent); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
::cue { color: var(--ink); background: color-mix(in oklch, var(--bg) 72%, transparent); font-family: var(--font-text); }
/* forum · ἀγορά
   layout: one column of text (52 to 65 characters a line) on the section's fog (density .62, light .4), which clears
   behind the column. the seal holds the top-left corner, the eye the bottom-left, the passage corner stays free:
   on narrow screens the column scrolls between them, dissolving at its edges, so text never passes under a corner.
   nothing has a box: posts are grouped by space, the form's only line is a brush stroke, pictures are stipple. */

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
  font: var(--type-body-weight) var(--type-body-size)/var(--type-body-line) var(--font-text);
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-theme) var(--easing-settle), color var(--duration-theme) var(--easing-settle);
}
a { color: inherit; }
button { font: inherit; letter-spacing: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; border-radius: var(--radius-none); text-transform: lowercase; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
:focus { outline: none; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }

#fog { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: var(--z-fog); pointer-events: none;
  opacity: 0; transition: opacity var(--duration-scene) var(--easing-settle); }
#fog.on { opacity: 1; }

/* the seal: closed into the corner, it leads home */
#seal {
  position: fixed; z-index: var(--z-seal); display: block; color: var(--seal);
  left: calc(var(--space-4) + env(safe-area-inset-left, 0px)); top: calc(var(--space-4) + env(safe-area-inset-top, 0px));
  height: 64px; width: calc(64px * 385 / 533);
}

/* ---------- the column ---------- */
/* .aph-ink sits on #scroller, not on #forum inside it: the scroller is the stacking context, so only it can blend
   with the fog beneath while the eye's wave runs */
#scroller {
  position: fixed; inset: 0; z-index: var(--z-main); overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
  transition: opacity var(--duration-scene) var(--easing-settle), filter var(--duration-scene) var(--easing-settle);
}
#scroller.away { opacity: 0; filter: blur(10px); pointer-events: none; }
#forum {
  max-width: 640px; margin: 0 auto;
  padding: var(--space-7) max(16px, env(safe-area-inset-right, 0px)) var(--space-8) max(16px, env(safe-area-inset-left, 0px));
}
@media (max-width: 820px), (max-height: 520px) {
  #scroller {
    /* the bottom stops above the corner band (the eye and ear, the passage up to three lines), so a post's reply and
       report never sit under the passage */
    top: calc(96px + env(safe-area-inset-top, 0px)); bottom: calc(var(--space-7) + env(safe-area-inset-bottom, 0px));
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 var(--space-4), #000 calc(100% - var(--space-5)), transparent);
    mask-image: linear-gradient(to bottom, transparent, #000 var(--space-4), #000 calc(100% - var(--space-5)), transparent);
  }
  #forum { padding-top: var(--space-4); padding-bottom: var(--space-6); }
}

/* the title: its gloss above it, both leaning at -12 */
h1 {
  font: 400 clamp(44px, 8vw, 96px)/1 var(--font-display); font-variation-settings: "wght" 400, "slnt" -12;
  margin: 0; padding-right: .2em; text-transform: lowercase;
}
h1 .gloss {
  display: block; font: 400 var(--type-gloss-title-size)/1 var(--font-display); font-variation-settings: "wght" 400, "slnt" -12;
  letter-spacing: var(--type-gloss-title-tracking); color: var(--ink-soft); margin-bottom: var(--space-3); padding: .2em .2em 0 0;
}
h1 .w { display: inline-block; }
.lede { font-size: var(--type-lede-size); line-height: var(--type-lede-line); margin: var(--space-4) 0 0; max-width: 52ch; }
.tools { margin: var(--space-3) 0 0; display: flex; gap: var(--space-4); align-items: baseline; flex-wrap: wrap; }
.tools button, .tools #note { color: var(--ink-soft); letter-spacing: var(--type-meta-tracking); padding: var(--space-1) 0; }
.tools button:hover { color: var(--accent-text); }

.is-thread .lede { display: none; }
.is-thread h1 { font-size: clamp(40px, 6vw, 64px); }

/* ---------- entrances: a blur and a rise, never typed ---------- */
.enter { opacity: 0; filter: blur(10px); transform: translateY(14px); }
.in { transition: opacity var(--duration-scene) var(--easing-settle), filter var(--duration-scene) var(--easing-settle), transform var(--duration-scene) var(--easing-settle);
  transition-delay: calc(min(var(--i, 0), 10) * 60ms); }
#view.leaving { opacity: 0; filter: blur(6px); transition: opacity var(--duration-quick) var(--easing-settle), filter var(--duration-quick) var(--easing-settle); }
#head { transition: opacity var(--duration-quick) var(--easing-settle), filter var(--duration-quick) var(--easing-settle); }
.turning #head { opacity: 0; filter: blur(6px); }

/* labels that act: lowercase, tracked, no boxes */
.act { font-size: var(--type-label-size); letter-spacing: var(--type-label-tracking); line-height: 1; padding: var(--space-2) 0; color: var(--ink); text-decoration: none; display: inline-block; }
.act:hover { color: var(--accent-text); }
.act[disabled] { color: var(--ink-soft); }
/* small labels that act keep their size; their hit area is at least 44px each way, so a finger can take them */
.act, .tools button, .pm button, .pm .num { position: relative; }
.act::after, .tools button::after, .pm button::after, .pm .num::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 100%; min-width: 44px; height: 44px; transform: translate(-50%, -50%);
}

/* ---------- the board ---------- */
.board-top { margin-top: var(--space-6); }
.threads { list-style: none; margin: var(--space-5) 0 0; padding: 0; }
.row { display: grid; grid-template-columns: 88px 1fr; gap: var(--space-4); align-items: center; padding: var(--space-3) 0; text-decoration: none; color: var(--ink); }
.row .thumb { width: 88px; min-height: 40px; display: grid; place-items: center; color: var(--fog); }
.row .first { display: block; line-height: 1.55; }
.row:hover .first, .row:focus-visible .first { color: var(--accent-text); }
.row .meta { display: block; margin-top: var(--space-1); }
.row .noimg { color: var(--ink-soft); font-size: var(--type-meta-size); letter-spacing: var(--type-meta-tracking); }
.empty { color: var(--ink-soft); padding: var(--space-5) 0 var(--space-3); }
.empty .aph-gloss { display: block; font-size: var(--type-gloss-size); line-height: 1.4; padding-right: .2em; }
.empty .aph-meta { display: block; margin-top: var(--space-2); }
/* the end of the list: older threads gathered here, then the board's beginning */
.board-end { margin: var(--space-4) 0 0; color: var(--ink-soft); min-height: 1lh; }

/* ---------- a thread ---------- */
.crumbs { margin: var(--space-5) 0 0; }
.posts { list-style: none; margin: var(--space-5) 0 0; padding: 0; }
.post { padding: var(--space-4) 0; display: flow-root; scroll-margin-top: var(--space-6); }

.post:focus, .post:focus-visible { outline: none; }
.pm { display: flex; align-items: center; flex-wrap: wrap; gap: 0 var(--space-2); margin: 0; }
.pm .sigil { width: 36px; height: 36px; color: var(--ink-soft); display: inline-block; margin-right: var(--space-1);
  transition: color var(--duration-slow) var(--easing-settle); }
.pm .sigil svg { width: 100%; height: 100%; display: block; }
.post.hit .sigil, .post:focus-visible .sigil { color: var(--accent); }
.pm .num { color: var(--ink); text-decoration: none; }
.pm button, .pm .num { padding: var(--space-1) 0; }
.pm button { color: var(--ink-soft); }
.pm button:hover, .pm .num:hover { color: var(--accent-text); }
.pm .op { color: var(--ink-soft); }
/* the owner's post: the gate's eye drawn as a mark, in rubedo, where the sigil would be, with as much ink as a sigil
   (48 wide, 14/24 of that high, centred on the sigil's 36px row), and the name in Aphesis Script. Nothing else
   changes: no box, no rule, the words as anyone's */
.pm .owner-eye { display: inline-block; width: 48px; color: var(--accent); margin: calc((36px - 48px * 14 / 24) / 2) var(--space-1) calc((36px - 48px * 14 / 24) / 2) 0; }
.pm .owner-eye svg { display: block; }
.owner-name { color: var(--accent-text); font-size: var(--type-gloss-size); line-height: var(--type-gloss-line); letter-spacing: .02em; }
.pm .owner-name { padding-right: .2em; }
.row .meta .owner-name { font-size: var(--type-gloss-title-size); line-height: 1; padding-right: .25em; }
.body { margin: var(--space-2) 0 0; overflow-wrap: anywhere; max-width: 62ch; }
.body .q { color: var(--ink-soft); }
a.ref { color: var(--ink-soft); text-decoration: none; padding: 2px 0; }
a.ref:hover, a.ref:focus-visible { color: var(--accent-text); }
.removed .body { color: var(--ink-soft); }

/* a picture in a post: a still simulacrum, opened as a live one */
.pic { float: left; margin: var(--space-2) var(--space-4) var(--space-2) 0; max-width: 45%; }
.pic .open { display: block; color: var(--fog); line-height: 0; }
.pic .open svg { display: block; max-width: 100%; height: auto; }
.pic figcaption { margin-top: var(--space-1); max-width: 260px; }
.pic figcaption a, .textpic a { color: var(--ink-soft); text-decoration: none; }
.pic figcaption a:hover { color: var(--accent-text); }
.textpic { margin: var(--space-2) 0 0; }
.textpic a { color: var(--ink-soft); }
.still { display: block; }
@media (max-width: 520px) {
  .pic { float: none; max-width: 100%; margin-right: 0; }
}

/* ---------- the form ---------- */
.composer { margin-top: var(--space-5); }
.composer textarea {
  display: block; width: 100%; min-height: 7.2em; max-height: 60vh; resize: none; overflow-y: auto; margin: 0; padding: var(--space-2) 0;
  background: transparent; border: 0; border-radius: var(--radius-none); color: var(--ink);
  font: var(--type-body-weight) var(--type-body-size)/var(--type-body-line) var(--font-text); text-shadow: inherit;
}
.composer textarea::placeholder { color: var(--ink-soft); opacity: 1; }
.composer textarea:focus-visible { outline: none; }
.baseline { display: block; width: 100%; height: 8px; color: var(--ink-soft); transition: color var(--duration-slow) var(--easing-settle); }
.baseline path { fill: currentColor; }
.composer:focus-within .baseline { color: var(--accent); }
.crow { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4); margin-top: var(--space-3); }
.crow .grow { flex: 1; }
.file { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
.file:focus-visible + label { outline: 1px solid var(--accent); outline-offset: 4px; }
.attach { cursor: pointer; }
.chosen { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-3); color: var(--fog); }
.chosen .act { color: var(--ink-soft); }
.count { color: var(--ink-soft); }
.status { min-height: 1.7em; margin: var(--space-2) 0 0; }
.status.err { color: var(--accent-text); }
.ts { margin-top: var(--space-3); }

/* ---------- the viewer: one live simulacrum over the fog ---------- */
#viewer { position: fixed; inset: 0; z-index: var(--z-main); pointer-events: none; }
#vbar { pointer-events: auto; }
.layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; pointer-events: none;
  opacity: 0; transition: opacity var(--duration-scene) var(--easing-settle); }
.layer.on { opacity: 1; }
.vstill { position: fixed; inset: 0; display: grid; place-items: center; color: var(--fog); pointer-events: none;
  opacity: 0; transition: opacity var(--duration-scene) var(--easing-settle); }
.vstill.on { opacity: 1; }
#vbar { position: fixed; z-index: var(--z-corner); text-align: right; max-width: min(380px, calc(100vw - 140px));
  right: max(16px, calc(var(--space-4) + env(safe-area-inset-right, 0px))); top: calc(var(--space-5) + env(safe-area-inset-top, 0px));
  opacity: 0; transition: opacity var(--duration-scene) var(--easing-settle); }
#vbar.on { opacity: 1; }
#vbar p { margin: 0; }
.vctl { display: flex; gap: var(--space-4); justify-content: flex-end; margin-top: var(--space-2) !important; }
.vctl a, .vctl button { color: var(--ink); text-decoration: none; padding: var(--space-1) 0; }
.vctl a:hover, .vctl button:hover { color: var(--accent-text); }

/* the quoted post, beside a >>n reference: the tooltip's own look, shown whole */
.quote-tip { max-width: min(340px, calc(100vw - 32px)); }
.quote-tip .qs { display: inline-block; width: 18px; height: 18px; vertical-align: -4px; margin-right: var(--space-2); color: var(--ink-soft); }
.quote-tip .qs svg { width: 100%; height: 100%; display: block; }
.quote-tip .qo { width: 22px; height: 22px; vertical-align: -6px; color: var(--accent); }
.quote-tip .owner-name { font-size: var(--type-gloss-title-size); }

/* ---------- corners ---------- */
#controls {
  position: fixed; z-index: var(--z-corner); display: flex; align-items: center; gap: var(--space-2);
  left: calc(var(--space-3) + env(safe-area-inset-left, 0px)); bottom: calc(var(--space-3) + env(safe-area-inset-bottom, 0px));
}
#controls button { padding: var(--space-2); }
#controls button:focus-visible { outline-offset: 2px; }
#bTheme { width: 46px; height: 46px; position: relative; color: var(--accent); }
#bTheme .eye { position: absolute; inset: var(--space-2); display: block; transform-origin: 50% 50%;
  transition: opacity var(--duration-quick) var(--easing-settle), transform var(--duration-slow) var(--easing-settle); }
#bTheme .eye svg { width: 100%; height: 100%; display: block; overflow: visible; }
#bTheme .eye.closed { opacity: 0; transform: scaleY(.2) translateY(-4px); }
.is-dark #bTheme .eye.open { opacity: 0; transform: scaleY(.08); }
.is-dark #bTheme .eye.closed { opacity: 1; transform: none; }

/* during the eye's wave, still simulacra are ink too: their cells become white, so the difference blend keeps them
   the negative of the ground beneath, like the text (the runtime's .aph-ink rule leaves --fog as it is) */
.aph-shifting .aph-ink { --fog: #fff; }

</style>

<canvas id="fog" aria-hidden="true"></canvas>

<div id="scroller" class="aph-ink" tabindex="-1">
  <main id="forum" class="aph-on-fog">
    <header id="head">

      <p class="lede" data-text="forum.lede">talk without names. each voice gets a sigil, the same one all through a thread; every picture arrives as fog.</p>
      <p class="tools aph-meta">
        <button id="bImages" type="button" aria-pressed="true" data-cursor=".55" data-tip="pictures as fog, or words only" data-text-tip="forum.pictures">images · on</button>
        <span id="note" hidden></span>
      </p>
    </header>
    <div id="view"></div>
  </main>
</div>

<div id="viewer" hidden>
  <canvas id="vcanvas" class="layer" aria-hidden="true"></canvas>
  <div id="vstill" class="vstill" aria-hidden="true"></div>
  <div id="vbar" class="aph-on-fog aph-ink" role="dialog" aria-modal="true" aria-labelledby="vcap">
    <p id="vcap" class="aph-meta"></p>
    <p class="vctl aph-meta">
      <a id="vorig" href="#" target="_blank" rel="noopener noreferrer" data-cursor=".55" aria-label="the original image, in a new tab">original</a>
      <button id="vclose" type="button" data-cursor=".55">close</button>
    </p>
  </div>
</div>

<div class="corner" id="controls">
  <button id="bTheme" type="button" aria-label="switch between light and dark" data-tip="open · close the eye" data-cursor=".55"><span class="eye open"></span><span class="eye closed"></span></button>

  if (q && current.comp) {
    current.comp.quote(+q.dataset.quote);
    scrollToEl(scroller, current.comp.el, Math.max(120, scroller.clientHeight - current.comp.el.offsetHeight - 40));
    return;
  }
  const rep = e.target.closest('[data-report]');
  if (rep && current.thread) {
    rep.disabled = true;
    api.report(current.thread, +rep.dataset.report).then(() => {
      rep.textContent = 'reported'; rep.removeAttribute('aria-label'); announce('reported. thank you.');
    }).catch(() => { rep.disabled = false; announce('the report did not go through'); });
    return;
  }
  const op = e.target.closest('[data-open]');
  if (op && current.data) {
    const p = current.data.posts.find((x) => x.n === +op.dataset.open);
    if (p && p.image) viewer.show(p.image, op);
  }
});

/* ---------- >>n: the quoted post beside the reference, on hover and on focus, shown whole ---------- */
const qtip = $('qtip');
let qFor = null;
function showQuote(a) {
  if (!current.data) return;
  const p = current.data.posts.find((x) => x.n === +a.dataset.ref);
  qFor = a;
  if (!p) qtip.textContent = 'no post ' + a.dataset.ref + ' in this thread';
  else if (p.removed) qtip.textContent = p.n + ' · removed';
  else {
    const words = firstLine(p.text.replace(/^>(?!>).*$/gm, ''), 220) || 'a picture';
    qtip.innerHTML = p.owner === true
      ? '<span class="qs qo aph-red" aria-hidden="true">' + ownerIcon() + '</span><span class="owner-name aph-display">' + OWNER + '</span> · ' + p.n + ' · ' + esc(words)
      : '<span class="qs" aria-hidden="true">' + sigilSVG(p.poster) + '</span>' + p.n + ' · ' + esc(words);
  }
  const r = a.getBoundingClientRect();
  qtip.classList.add('on');
  const w = qtip.offsetWidth, h = qtip.offsetHeight;
  let x = Math.min(innerWidth - 16 - w, Math.max(16, r.left));
  let y = r.bottom + 10;
  if (y + h > innerHeight - 16) y = r.top - 10 - h;
  qtip.style.left = x + 'px'; qtip.style.top = Math.max(16, y) + 'px';
}
function hideQuote() { qFor = null; qtip.classList.remove('on'); }
view.addEventListener('pointerover', (e) => { const a = e.target.closest('a.ref'); if (a && a !== qFor) showQuote(a); });
view.addEventListener('pointerout', (e) => { const a = e.target.closest('a.ref'); if (a && !a.contains(e.relatedTarget)) hideQuote(); });
view.addEventListener('focusin', (e) => { const a = e.target.closest('a.ref'); if (a) showQuote(a); });
view.addEventListener('focusout', (e) => { if (e.target.closest('a.ref')) hideQuote(); });
scroller.addEventListener('scroll', () => { if (qFor && document.activeElement !== qFor) hideQuote(); }, { passive: true });
addEventListener('pointerdown', (e) => { if (!e.target.closest('a.ref')) hideQuote(); });

show(route());

return {  };
})();
})();
</script>
