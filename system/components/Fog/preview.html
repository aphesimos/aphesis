<!-- @dsCard group="Fields" height=360 subtitle="the stippled ground; calm behind text, a soft rise around the pointer, a clearing for a section" -->
<div class="f">
  <canvas id="c" aria-hidden="true"></canvas>
  <div class="t aph-on-fog" id="t"><p class="aph-gloss g">codex</p><p class="aph-display h">aφesis</p><p class="aph-meta">the ground is calm behind text: each text block is a zone the fog thins around</p></div>
  <label class="k aph-meta">clear <input id="k" type="range" min="0" max="1" step=".01" value="0" aria-label="clear"></label>
  <button class="b aph-meta" id="b" type="button" aria-pressed="false">enter a section</button>
</div>
<style>
.f{position:relative;height:360px;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.t{position:absolute;left:var(--space-6);top:50%;transform:translateY(-50%);max-width:340px}
.t p{margin:0}.g{font-size:13px;letter-spacing:.3em;margin-bottom:var(--space-3)!important}.h{font-size:68px;color:var(--ink)}
.t .aph-meta{margin-top:var(--space-4)}
.k,.b{position:absolute;right:var(--space-4);z-index:2;text-shadow:0 0 6px var(--bg),0 0 12px var(--bg)}
.k{top:var(--space-4);display:flex;gap:var(--space-2);align-items:center}
.b{bottom:var(--space-4);background:none;border:0;padding:0;color:var(--ink-soft);cursor:pointer}
.b[aria-pressed="true"]{color:var(--accent-text)}
</style>
<script>var F=Aphesis.Fog(document.getElementById('c'),{density:1,light:1});F.zones([{el:document.getElementById('t'),pad:30}]);
/* the slider sets clear directly; the button does what a section does: clear 1 entering, 0 back home, eased by the fog itself */
var K=document.getElementById('k'),B=document.getElementById('b');
K.oninput=function(){F.set({clear:+K.value});};
B.onclick=function(){var on=B.getAttribute('aria-pressed')!=='true';B.setAttribute('aria-pressed',on);B.textContent=on?'back home':'enter a section';K.value=on?1:0;F.set({clear:on?1:0,density:on?.62:1,light:on?.4:1});};</script>
