:root{--n-100:oklch(0.95 0.004 25);--n-300:oklch(0.80 0.007 25);--n-500:oklch(0.60 0.008 25);--n-600:oklch(0.50 0.008 25);--n-800:oklch(0.30 0.007 25);--n-900:oklch(0.20 0.006 25);--n-975:oklch(0.11 0.004 25);
 --bg:var(--n-100);--ink:var(--n-900);--soft:var(--n-600);--line:var(--n-300);--accent:oklch(0.47 0.185 26);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:var(--n-975);--ink:var(--n-100);--soft:var(--n-500);--line:var(--n-800);--accent:oklch(0.57 0.2 26);color-scheme:dark}}
:root[data-theme="dark"]{--bg:var(--n-975);--ink:var(--n-100);--soft:var(--n-500);--line:var(--n-800);--accent:oklch(0.57 0.2 26);color-scheme:dark}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Special Elite",ui-monospace,monospace}
main{max-width:1120px;margin:0 auto;padding-block:40px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:clamp(22px,3.4vw,30px);font-weight:400;margin:0 0 8px} .lead{color:var(--soft);max-width:72ch;margin:0 0 20px}
.as{font-family:"Aphesis Script",serif}
#live{font-size:clamp(90px,16vw,200px);line-height:1.15;color:var(--accent);font-variation-settings:"wght" var(--w),"slnt" var(--s);--w:400;--s:0;margin:10px 0 6px;overflow-wrap:anywhere}
#live.breathe{animation:breathe 4.2s ease-in-out infinite}
@keyframes breathe{0%,100%{--w:340}50%{--w:720}}
@property --w{syntax:"<number>";inherits:true;initial-value:400}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 28px;border-top:1px solid var(--line);padding-top:16px;margin-bottom:26px}
label{display:flex;flex-direction:column;gap:4px;color:var(--soft);font-size:13px} label b{color:var(--ink);font-weight:400}
input[type=range]{accent-color:var(--accent)} input[type=text]{font:inherit;background:none;color:var(--ink);border:1px solid var(--line);padding:6px 8px}
button{font:inherit;background:none;color:var(--ink);border:1px solid var(--line);padding:6px 10px;cursor:pointer;justify-self:start}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;border-top:1px solid var(--line);padding-top:18px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.cell{min-width:0} .cell .as{font-size:clamp(44px,6vw,72px);line-height:1.1} .cell p{margin:0;color:var(--soft);font-size:12px}
</style>
<main><h1>aphesis script — variable</h1>
<p class="lead">A real font file now (6 KB, WOFF2), with two axes you set freely: weight 300–800 and slant 0–16°. The letters are widened toward the φ. Only the sample letters exist so far: a, p, h, e, s, i and φ (anything else falls back to the text face).</p>
<div id="live" class="as" aria-live="off">aφesis</div>
<div class="ctl">
 <label><span>weight <b id="vw">400</b></span><input id="w" type="range" min="300" max="800" step="1" value="400"></label>
 <label><span>slant <b id="vs">0</b>°</span><input id="s" type="range" min="0" max="16" step="0.5" value="0"></label>
 <label><span>text</span><input id="t" type="text" value="aφesis" maxlength="40" aria-label="text to set in aphesis script"></label>
 <button id="br" type="button" aria-pressed="false">breathe the weight</button>
</div>
<div class="grid" id="grid"></div>
</main>
<script>
const L=document.getElementById('live');
const upd=()=>{const w=+document.getElementById('w').value,s=+document.getElementById('s').value;L.style.setProperty('--w',w);L.style.setProperty('--s',-s);
  document.getElementById('vw').textContent=w;document.getElementById('vs').textContent=s;};
['w','s'].forEach(id=>document.getElementById(id).addEventListener('input',upd));
document.getElementById('t').addEventListener('input',e=>{L.textContent=e.target.value||' ';});
document.getElementById('br').onclick=e=>{const on=L.classList.toggle('breathe');e.target.setAttribute('aria-pressed',on);};
const G=document.getElementById('grid');
[[300,0],[400,0],[800,0],[300,8],[400,8],[800,8],[300,16],[400,16],[800,16]].forEach(([w,s])=>{
  const c=document.createElement('div');c.className='cell';c.innerHTML=`<div class="as" style="font-variation-settings:'wght' ${w},'slnt' ${-s}">aphesis</div><p>weight ${w} · slant ${s}°</p>`;G.appendChild(c);});
</script>
