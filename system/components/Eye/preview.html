<!-- @dsCard group="Identity" height=420 subtitle="the eye, alive: drawn in, trembling at 8 fps, hard-cut blinks and saccades" -->
<div class="wrap">
  <div class="eye" id="e" aria-hidden="true"></div>
  <div class="acts">
    <button type="button" class="aph-label" id="bBlink">blink</button>
    <button type="button" class="aph-label" id="bClose">close</button>
    <button type="button" class="aph-label" id="bOpen">open</button>
    <button type="button" class="aph-label" id="bWide">wide</button>
  </div>
  <p class="aph-meta" id="st">·</p>
  <p class="small" aria-label="small shared eyes, as the owner's mark"><span class="s"></span><span class="s"></span><span class="s"></span></p>
</div>
<style>
.wrap{display:flex;flex-direction:column;align-items:center;gap:var(--space-4);padding:var(--space-5)}
.eye{width:min(420px,80vw);color:var(--accent)}
.acts{display:flex;gap:var(--space-5)}
.acts button{background:none;border:0;padding:var(--space-2) 0;color:var(--ink);font:inherit;cursor:pointer}
.aph-meta{margin:0;color:var(--ink-soft)}
.small{display:flex;gap:var(--space-5);margin:0}
.small .s{width:56px;color:var(--accent)}
</style>
<script>
const eye = Aphesis.Eye(document.getElementById('e'), { gaze: 'auto' });
eye.on((s) => { document.getElementById('st').textContent = s.blink + ' · ' + s.gaze; });
document.getElementById('bBlink').onclick = () => eye.blink();
document.getElementById('bClose').onclick = () => eye.close();
document.getElementById('bOpen').onclick = () => eye.open();
document.getElementById('bWide').onclick = () => eye.wide();
/* the owner's mark: small eyes on one shared tick, still while off screen */
document.querySelectorAll('.small .s').forEach((el) => Aphesis.Eye(el, { size: 56, mark: true, drawIn: false }));
</script>
