# Publishes the one-page site to Cloudflare Pages on every push to `site` that changes the built page.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Account · Cloudflare Pages · Edit) and CLOUDFLARE_ACCOUNT_ID.
name: deploy

on:
  push:
    branches: [site]
    paths:
      - site/index.html
      - site/public/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: aphesist
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Assemble what is served
        run: |
          mkdir dist
          cp site/index.html dist/index.html
          cp -r site/public/. dist/

      - name: Create the Pages project the first time
        run: |
          if ! npx --yes wrangler@3.114.0 pages project list | grep -q "\b$PROJECT\b"; then
            npx --yes wrangler@3.114.0 pages project create "$PROJECT" --production-branch site
          fi

      - name: Deploy
        run: npx --yes wrangler@3.114.0 pages deploy dist --project-name "$PROJECT" --branch site --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --format=%s)"
