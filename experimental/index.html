/* aphes.is components. Every value comes from tokens.css (generated from tokens.json). */
/* two faces only. Aphesis Script (fonts/, a file): the wordmark, titles and glosses, and every Greek or CJK
   character. Special Elite (Google Fonts): everything people read and operate; it falls back to Aphesis Script
   for the scripts it lacks. */
body { background: var(--bg); color: var(--ink); font-family: var(--font-text); }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }

/* tooltip: page ground, a hairline of accent on the left, small text typed fast */
.aph-tip {
  position: fixed; left: 0; top: 0; z-index: var(--z-tip); pointer-events: none;
  max-width: min(320px, calc(100vw - 32px)); padding: var(--space-2) var(--space-3);
  background: var(--bg); color: var(--ink-soft); border-left: 1px solid var(--accent);
  font: 400 11px/1.6 var(--font-text); letter-spacing: .06em;
  opacity: 0; filter: blur(4px); transform: translateY(4px);
  transition: opacity var(--duration-quick) ease, filter var(--duration-quick) ease, transform var(--duration-quick) var(--easing-settle);
}
.aph-tip.on { opacity: 1; filter: none; transform: none; }

/* cursor: a white disc in difference blend, the negative of whatever it covers */
@media (hover: hover) and (pointer: fine) {
  .aph-has-cursor, .aph-has-cursor *, .aph-has-cursor *::before, .aph-has-cursor *::after { cursor: none !important; }
}
.aph-cursor {
  position: fixed; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: var(--radius-disc);
  background: #fff; mix-blend-mode: difference; pointer-events: none; z-index: var(--z-cursor);
  transform: translate(-100px, -100px) scale(.2); opacity: 0; transition: opacity var(--duration-quick) ease;
}
.aph-cursor.on { opacity: 1; }

/* letter wave: letters lift a hair, one after another; nothing around them moves */
.ltr { display: inline-block; transition: transform var(--duration-slow) var(--easing-settle); transition-delay: calc(var(--i) * 22ms); }
.aph-wave:hover .ltr, .aph-wave:focus-visible .ltr { transform: translateY(-2px); }

/* typist caret: solid while typing, blinking when idle, fading when done */
.aph-caret { display: inline-block; width: .55em; height: 1.05em; margin-left: .12em; vertical-align: -.18em; background: currentColor; opacity: .75; }
.aph-caret.blink { animation: aph-blink 1.06s steps(1, end) infinite; }
.aph-caret.gone { opacity: 0; transition: opacity 1.2s ease; }
@keyframes aph-blink { 50% { opacity: 0; } }

/* type roles as classes (the same roles tokens.json lists) */
/* display text leans: titles and glosses take the slant axis at -12 (the φ stays upright on its own) */
.aph-display { font-family: var(--font-display); font-weight: 400; font-variation-settings: "wght" 400, "slnt" -12; text-transform: lowercase; line-height: .95; padding-right: .2em; }
.aph-gloss { font-family: var(--font-display); font-variation-settings: "wght" 400, "slnt" -12; letter-spacing: .02em; color: var(--ink-soft); text-transform: lowercase; }
.aph-label { font-family: var(--font-text); font-size: 13px; letter-spacing: .22em; text-transform: lowercase; }
.aph-meta { font-family: var(--font-text); font-size: 11px; letter-spacing: .14em; color: var(--ink-soft); }

/* text on fog keeps a halo of ground so it never sits on dots */
.aph-on-fog { text-shadow: 0 0 4px var(--bg), 0 0 10px var(--bg), 0 0 18px var(--bg); }

@media (prefers-reduced-motion: reduce) {

/* experimental · ἄδυτον
   layout: one screen. dark fog is the ground (density .74 at the door, .3 inside a chamber); the door stands alone
   on the axis, in a small clearing of the fog. the seal holds the top-left corner, the eye the bottom-left, the
   passage corner stays free. a chamber replaces the door with simulacra laid over the fog and blended into it. */

#experimental { position: fixed; inset: 0; z-index: var(--z-main); pointer-events: none; display: grid; place-items: center; }

#bTheme { width: 46px; height: 46px; position: relative; color: var(--accent) !important; }

M["motion.js"] = (function () {
/* motion: reduced motion, the section's frame, a tween eased with minimum jerk, and a wait.
   There is no pause: every loop in the section ends on its own, and reduced motion makes it still. */

const A = window.Aphesis;
const REDUCED = A.reducedMotion;
const frame = (cb) => requestAnimationFrame(cb);

/* a tween over dur ms, eased with minimum jerk (Aphesis.MJ). fn(e) gets 0 to 1. With reduced motion it lands at once. */
function travel(dur, fn, done) {
  let t0 = null, live = true;
  if (REDUCED || dur <= 0) { fn(1); if (done) done(); return () => {}; }
  function step(now) {
    if (!live) return;
    if (t0 === null) t0 = now;
    const k = Math.min(1, (now - t0) / dur);
    fn(A.MJ(k));
    if (k < 1) requestAnimationFrame(step); else if (done) done();
  }
  requestAnimationFrame(step);
  return () => { live = false; };
}

/* a wait that can be cancelled */
function wait(ms, fn) {
  const id = setTimeout(fn, ms);
  return () => clearTimeout(id);
}

/* call fn once, whichever comes first: the callback it is given, or ms of waiting. Animations hand off through this,
   so a slow or missed frame can never leave the journey stuck between two steps. */
function once(ms, start, fn) {
  let done = false;
  const go = () => { if (done) return; done = true; clearTimeout(id); fn(); };
  const id = setTimeout(go, ms);
  start(go);
}

return { REDUCED, frame, travel, wait, once };
})();

M["memory.js"] = (function () {
/* memory: how far along the journey a visitor is, kept in this browser only.
   { next: 0..4 } is the next chamber the door opens. When the ending has played, the record is cleared, so the
   next visit starts over at the first chamber. Without storage (blocked, private) the journey is kept for this visit. */

const KEY = 'aphesis.experimental.journey';
let mem = 0;

function nextStep(count) {
  try {
    const v = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (v && Number.isInteger(v.next) && v.next >= 0 && v.next < count) return v.next;
    if (v === null) return mem;
  } catch (_) { return mem; }
  return 0;
}

function saveStep(n) {
  mem = n;
  try { localStorage.setItem(KEY, JSON.stringify({ next: n })); } catch (_) { /* storage blocked: kept for this visit */ }
}

function clearSteps() {
  mem = 0;
  try { localStorage.removeItem(KEY); } catch (_) { /* nothing to clear */ }
}

return { nextStep, saveStep, clearSteps };
})();

   At rest he sinks a little and rises again: the only hint. */

const { MAPS } = M["assets.js"];
const { image, picture, chaser } = M["stage.js"];
const { REDUCED } = M["motion.js"];
const STRIKES = 6;

const tablet = {
  id: 'tablet',
  caption: 'hermes trismegistus · Siena Cathedral pavement, 1488',
  label: 'a robed figure on a stone pavement, sunk in the fog.',
  async create(ctx) {
    const img = await image(MAPS.trismegistus);
    const portrait = innerHeight > innerWidth * 1.1;
    const sim = picture(ctx.root, { margin: portrait ? 0.02 : 0.08, gain: 0.42, erosion: 0.8, scatter: 0.8, ceiling: 0.62 });
    const shown = chaser(REDUCED ? 0 : 1100);
    let playing = false, struck = 0, clear = false, end = null, shiver = -1;
    const strike = () => {
      if (!playing || clear) return;
      struck = Math.min(STRIKES, struck + 1);
      shown.target = struck / STRIKES;
      shiver = performance.now();
    };
    const onDown = (e) => { if (!(e.target.closest && e.target.closest('a, button'))) strike(); };
    const onKey = (e) => { if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) { e.preventDefault(); strike(); } };
    addEventListener('pointerdown', onDown);
    addEventListener('keydown', onKey);
    return {
      pictures: [[sim, img]],
      play(done) { end = done; playing = true; },
      loop(dt, now) {
        const p = shown.step(now);
        ctx.root.dataset.progress = shown.target.toFixed(3);
        ctx.root.dataset.shown = p.toFixed(3);
        if (struck >= STRIKES && p > 0.999 && !clear) { clear = true; setTimeout(() => end && end(), REDUCED ? 2500 : 3200); }
        const rest = REDUCED || clear ? 0 : 0.04 * Math.sin(now / 1300) * (1 - p);
        /* the shiver: a smooth swell of loose points around him, 0.8 s, after each strike */
        const s = shiver < 0 || REDUCED ? 0 : Math.max(0, Math.min(1, (now - shiver) / 800));
        const swell = s > 0 && s < 1 ? Math.sin(Math.PI * s) ** 2 : 0;
        sim.o.gain = 0.42 + 0.68 * p + rest;
        sim.o.erosion = 0.85 - 0.65 * p;
        sim.o.scatter = 0.8 - 0.45 * p + 0.25 * swell;
        sim.o.ceiling = 0.62 + 0.2 * p;
      },
      destroy() { removeEventListener('pointerdown', onDown); removeEventListener('keydown', onKey); },
    };
  },
};

return { tablet };
})();
/* ---- chambers/ending.js ---- */
M["chambers/ending.js"] = (function () {
/* 5 · the ending.
   The door opens onto nothing: no picture, only more fog. A field of stipple gathers over everything, thin at
   first, then closing in from the edges toward the middle until the screen is swallowed (its gain rises over
   eight seconds; nothing is uploaded after the first frame). Under it, unseen but for a few holes, the door
   returns for the last time, filled with night and, once, in rubedo. The field dissolves and the door stands
   closed for good. No motion is asked; it only happens. Afterwards the seal in the corner is the way back,
   and the next visit begins the journey again. */

const { picture } = M["stage.js"];
const { REDUCED, travel } = M["motion.js"];
/* the density map: dense at the edges, emptier toward the middle, so rising gain fills it from the outside in */
function field() {
  const c = document.createElement('canvas'); c.width = 320; c.height = 200;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(160, 100, 0, 160, 100, 190);
  g.addColorStop(0, '#2a2a2a'); g.addColorStop(0.45, '#8c8c8c'); g.addColorStop(1, '#ffffff');
  x.fillStyle = g; x.fillRect(0, 0, c.width, c.height);
  return c;
}

const ending = {
  id: 'ending',
  final: true,
  fog: 0.62,
  caption: '',
  label: 'the door opens onto nothing. the fog closes in until nothing is left.',
  async create(ctx) {
    const sim = picture(ctx.root, { fit: 'cover', margin: 0, gain: 0.25, scatter: 0.3, erosion: 0.4, ceiling: 0.86 });
    /* larger than the screen, so the picture's feathered edges never show as a frame */
    Object.assign(sim.canvas.style, { left: '-12vw', top: '-12vh', width: '124vw', height: '124vh' });
    const timers = [];
    let stop = () => {};
    return {
      pictures: [[sim, field()]],
      play(done) {
        stop = travel(REDUCED ? 0 : 8000, (e) => { sim.o.gain = 0.25 + 1.05 * e; sim.o.erosion = 0.4 - 0.15 * e; }, () => {
          ctx.door.seal();
          timers.push(setTimeout(done, REDUCED ? 2500 : 2600));
        });
      },
      loop() {},
      destroy() { stop(); timers.forEach(clearTimeout); },
    };
  },
};

return { ending };
})();
/* ---- journey.js ---- */
M["journey.js"] = (function () {
/* the journey: the door, then one chamber, then the door again, in a fixed order, remembered between visits.

   Every chamber passes through the same sequence, run here so that it is the same for all of them:
     1. the door opens: its night deepens and it dissolves (0.7 s + 1.4 s); the fog thins to the chamber's ground;
     2. the chamber's pictures coalesce out of the fog (Simulacrum show, 2.6 s);
     3. its moment plays: one simple bodily motion, until the chamber says it has ended;
     4. its pictures dissolve (Simulacrum hide, 1.8 s), and their canvases are stopped and removed;
     5. the door re-forms (1.8 s) and the fog returns to the door's ground.
   Each hand-off waits for the animation's callback or a little longer than its duration, whichever comes first,
   so a slow frame can never leave the journey stuck. Everything that travels is eased with minimum jerk.

   A chamber module exports { id, caption, label, create(ctx) }. create() resolves to
   { pictures: [[picture, source], ...], fog?, play(end), loop(dt, now), destroy() }.
   The last chamber (final: true) does not return to an open door: it closes it for good and clears the record,
   so the next visit begins the journey again. */

const { frame, once, REDUCED } = M["motion.js"];
const { nextStep, saveStep, clearSteps } = M["memory.js"];
const DOOR_FOG = 0.74, CHAMBER_FOG = 0.3;

function createJourney({ chambers, ground, door, caption, announce, zones, root: host }) {
  const html = document.documentElement;
  let state = 'door', active = null, def = null, root = null;
  let next = nextStep(chambers.length);

  function mark(s) {
    state = s;
    html.dataset.step = s;
    html.dataset.next = String(next);
    html.dataset.chamber = def ? def.id : '';
  }

  function setCaption(text) {
    caption.classList.remove('on');
    setTimeout(() => { caption.textContent = text; if (text) caption.classList.add('on'); }, REDUCED ? 0 : 400);
  }

  async function open() {
    if (state !== 'door') return;
    def = chambers[next];
    mark('opening');
    ground.to(def.fog === undefined ? CHAMBER_FOG : def.fog, 2000);
    zones(def.final ? 'none' : 'chamber');
    root = document.createElement('div');
    root.className = 'chamber-root';
    const desc = document.createElement('p');
    desc.className = 'sr'; desc.tabIndex = -1; desc.textContent = def.label;
    root.appendChild(desc);
    host.after(root);
    const doorOpened = new Promise((r) => once(2600, (go) => door.open(go), r));
    try {
      active = await def.create({ root, setCaption, door, ground });
    } catch (err) {
      console.error(err);
      root.remove(); root = null; active = null;
      await doorOpened;
      return back(false);
    }
    await doorOpened;
    mark('gathering');
    if (def.caption) setCaption(def.caption);
    announce(def.label);
    desc.focus({ preventScroll: true });
    const pics = active.pictures || [];
    once(pics.length ? 3400 : 0, (go) => {
      if (!pics.length) return go();
      let n = 0;
      pics.forEach(([p, src]) => p.show(src, () => { if (++n === pics.length) go(); }));
    }, () => {
      mark('chamber');
      let ended = false;
      active.play(() => { if (!ended) { ended = true; close(); } });
    });
  }

  function close() {
    if (state !== 'chamber') return;
    mark('closing');
    setCaption('');
    const ch = active, r = root, pics = ch.pictures || [];
    once(pics.length ? 2400 : 0, (go) => {
      if (!pics.length) return go();
      let n = 0;
      pics.forEach(([p]) => p.hide(() => { if (++n === pics.length) go(); }));
    }, () => {
      pics.forEach(([p]) => p.destroy());
      ch.destroy();
      r.remove();
      active = null; root = null;
      back(true);
    });
  }

  function back(advanced) {
    const final = advanced && def && def.final;
    if (final) {
      next = 0; clearSteps(); def = null;
      mark('sealing');
      zones('door');
      ground.to(DOOR_FOG, 2000);
      door.seal(() => mark('sealed'));
      announce('the door is closed.');
      return;
    }
    if (advanced) { next = Math.min(chambers.length - 1, next + 1); saveStep(next); }
    def = null;
    ground.to(DOOR_FOG, 2000);
    zones('door');
    mark('returning');
    door.show(() => mark('door'));
    /* the door can be used as soon as it begins to re-form */
    setTimeout(() => { if (state === 'returning') mark('door'); }, REDUCED ? 0 : 600);
    announce('the door.');
    setTimeout(() => door.el.focus({ preventScroll: true }), REDUCED ? 0 : 600);
  }

  door.el.addEventListener('click', () => {
    if (state === 'door' || state === 'returning') { state = 'door'; open(); }
  });

  let last = performance.now();
  (function loop(now) {
    const dt = Math.min(0.2, (now - last) / 1000); last = now;   /* a slow device still holds in real time */
    if (active && state === 'chamber') active.loop(dt, now);
    frame(loop);
  })(last);

  mark('door');
  return { get state() { return state; }, get next() { return next; } };
}

return { createJourney };
})();
/* ---- main.js ---- */
M["main.js"] = (function () {
/* experimental · ἄδυτον, as it will stand inside the site: dark fog, the seal in the corner, the eye in the
   bottom-left, the passage corner kept free, the runtime's cursor and tooltip. Nothing else but a door. */

const { REDUCED } = M["motion.js"];
const { createGround } = M["stage.js"];
const { createDoor } = M["door.js"];
const { createJourney } = M["journey.js"];
const { ouroboros } = M["chambers/ouroboros.js"];
const { hands } = M["chambers/hands.js"];
const { scholar } = M["chambers/scholar.js"];
const { tablet } = M["chambers/tablet.js"];
const { ending } = M["chambers/ending.js"];
const A = window.Aphesis;
const $ = (id) => document.getElementById(id);
const root = document.documentElement;
if (REDUCED) root.classList.add('reduced');

/* ---------- theme: the system's setting until the eye says otherwise ---------- */
const sysDark = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => (root.dataset.theme ? root.dataset.theme === 'dark' : sysDark.matches);
function themeState() {
  root.classList.toggle('is-dark', isDark());
  $('bTheme').dataset.tip = isDark() ? 'closed · open the eye' : 'open · close the eye';
}
document.querySelector('#bTheme .eye.open').innerHTML = A.icon('eye', 0);
document.querySelector('#bTheme .eye.closed').innerHTML = A.icon('eye', 1);
themeState();
sysDark.addEventListener('change', themeState);
$('bTheme').addEventListener('click', () => { root.dataset.theme = isDark() ? 'light' : 'dark'; themeState(); });

/* ---------- ground, seal, cursor, tooltip ---------- */
const ground = createGround($('fog'), 0.74);
A.seal($('seal'));
A.cursor();
A.tooltip();

/* ---------- the door and the journey behind it ---------- */
const door = createDoor($('door'));
const announceEl = $('announce');
const announce = (t) => { announceEl.textContent = ''; setTimeout(() => { announceEl.textContent = t; }, 60); };
const corners = [{ el: $('controls'), pad: 8 }, { el: $('seal'), pad: 10 }];
const ZONES = {
  door: corners.concat([{ el: $('door'), pad: 28 }]),
  chamber: corners.concat([{ el: $('caption'), pad: 12 }]),
  none: [],
};
createJourney({
  chambers: [ouroboros, hands, scholar, tablet, ending],
  ground, door, caption: $('caption'), announce, root: $('experimental'),
  zones: (mode) => ground.zones(ZONES[mode] || []),
});
ground.zones(ZONES.door);
door.show();

return {  };
})();
})();
</script>
