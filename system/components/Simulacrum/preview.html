<!-- @dsCard group="Fields" height=600 subtitle="pictures that exist only as fog; they coalesce, keep their lost points, and dissolve" -->
<div class="s">
  <canvas id="c" role="img" aria-label="a stippled image forming out of fog"></canvas>
  <nav id="n" aria-label="images"></nav>
  <p class="aph-meta cap" id="cap" aria-live="polite"></p>
</div>
<style>
.s{position:relative;height:600px;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
nav{position:absolute;left:var(--space-4);top:var(--space-4);display:flex;flex-direction:column;gap:1px;z-index:2}
nav button{background:none;border:0;padding:2px 0;text-align:left;color:var(--ink-soft);cursor:pointer;font-family:var(--font-text);font-size:11px;letter-spacing:.14em;text-shadow:0 0 6px var(--bg),0 0 12px var(--bg)}
nav button[aria-pressed="true"]{color:var(--accent-text)}
.cap{position:absolute;right:var(--space-4);bottom:var(--space-4);margin:0;max-width:320px;text-align:right;text-shadow:0 0 6px var(--bg),0 0 12px var(--bg)}
</style>
<script>
