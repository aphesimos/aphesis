# Tests, builds and deploys the Rust Workers in backend/ (the wall, the forum and the content service) on every push to `backend` that
# touches them. The services are listed once, in backend/services.json; a new Worker is one entry there.
#
# Repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, TURNSTILE_SECRET, WALL_HASH_SALT,
# WALL_ADMIN_TOKEN, FORUM_IP_SALT, FORUM_POSTER_SALT, FORUM_ADMIN_SECRET, CONTENT_OWNER_PASSWORD_HASH,
# CONTENT_OWNER_EMAIL, CONTENT_AUTH_SALT. Empty ones are skipped, a Worker without its Turnstile secret or salts
# refuses posts until they are set, and the content service's gate stays shut without its own (see backend/README.md).
# Repository variable: BACKEND_CUSTOM_DOMAINS = 1 serves wall-api, forum-api and content-api.aphes.ist as custom
# domains; without it the Workers answer on workers.dev only.
name: backend

on:
  push:
    branches: [backend]
    paths:
      - backend/**
      - .github/workflows/backend.yml
  workflow_dispatch:

concurrency:
  group: backend
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.97.0
  WORKER_BUILD: 0.8.7
  WRANGLER: npx --yes wrangler@4.153.0
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      services: ${{ steps.services.outputs.list }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the page's filter for the parity check, and what the content seed reads
        run: |
          for b in section/wall section/archive section/book section/works design-system; do
            git fetch --depth=1 origin "$b:refs/remotes/origin/$b"
          done

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Rust ${{ env.RUST_TOOLCHAIN }} with the Wasm target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-all-crates: true

      - name: The services
        id: services
        run: echo "list=$(jq -c '[.services[].name]' services.json)" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: cargo test --workspace --locked

      - name: Filter parity (the shared vectors against the page's JavaScript filter)
        run: node wall/tests/filter-parity.mjs

      - name: worker-build ${{ env.WORKER_BUILD }}
        run: cargo install worker-build@"$WORKER_BUILD" --locked

      - name: End-to-end tests under wrangler dev
        timeout-minutes: 15
        run: |
          for s in $(jq -r '.services[].name' services.json); do (cd "$s" && worker-build --release); done
          E2E_NO_BUILD=1 node --test --test-timeout=300000 --test-force-exit e2e/*.test.mjs

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.test.outputs.services) }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Rust ${{ env.RUST_TOOLCHAIN }} with the Wasm target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-all-crates: true

      - name: worker-build ${{ env.WORKER_BUILD }}
        run: cargo install worker-build@"$WORKER_BUILD" --locked

      - name: Build ${{ matrix.service }}
        working-directory: backend/${{ matrix.service }}
        run: worker-build --release

      - name: Size and bundle check
        run: node scripts/deploy.mjs "${{ matrix.service }}" --dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.service }}
          path: |
            backend/${{ matrix.service }}/build/
            !backend/${{ matrix.service }}/build/.tmp/
          include-hidden-files: false
          retention-days: 7

  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.test.outputs.services) }}
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKEND_CUSTOM_DOMAINS: ${{ vars.BACKEND_CUSTOM_DOMAINS }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.service }}
          path: backend/${{ matrix.service }}/build

      - name: Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are needed to deploy"; exit 1
          fi

      - name: Deploy ${{ matrix.service }}
        env:
          # the script picks the secrets this service maps in services.json, skips empty ones, never prints values
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: node scripts/deploy.mjs "${{ matrix.service }}"
