<title>aphes.ist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<style>
/*__CSS__*/
</style>
<!--__BODY__-->
<canvas id="fog" aria-hidden="true"></canvas>

<a id="seal" href="#home" aria-label="aphes.ist · back to the center" data-cursor=".9"></a>

<main id="gate" hidden>
  <div id="eye" class="gate-eye" aria-hidden="true"></div>
  <form id="one" class="gate-line" autocomplete="on" novalidate>
    <input id="key" name="password" type="password" autocomplete="current-password" enterkeyhint="go" spellcheck="false"
      autocapitalize="none" aria-label="φ" data-cursor=".55">
    <span class="marks aph-grains" aria-hidden="true"></span>
    <span class="caret blink" aria-hidden="true">_</span>
    <span class="baseline" aria-hidden="true"></span>
  </form>
  <form id="two" class="gate-line" autocomplete="off" novalidate hidden>
    <input id="words" name="words" type="text" autocomplete="one-time-code" enterkeyhint="go" spellcheck="false" autocorrect="off"
      autocapitalize="none" aria-label="φ" data-cursor=".55">
    <span class="mirror aph-ink" aria-hidden="true"></span>
    <span class="caret blink" aria-hidden="true">_</span>
    <span class="baseline" aria-hidden="true"></span>
  </form>
</main>

<div id="desk" hidden>
  <div id="deskIn" class="desk"></div>
</div>

<div class="corner" id="controls">
  <button id="bTheme" type="button" aria-label="switch between light and dark" data-tip="open · close the eye" data-cursor=".55"><span class="eye open"></span><span class="eye closed"></span></button>
</div>

<div class="sr" id="announce" aria-live="polite"></div>
