# content: the Rust Worker behind the archive, the book and works, and the owner's dashboard. See ../README.md.
# Secrets are never kept here: OWNER_PASSWORD_HASH, OWNER_EMAIL, AUTH_SALT, WALL_ADMIN_TOKEN, FORUM_ADMIN_SECRET,
# EXPORT_GITHUB_TOKEN (the deploy workflow pushes them).
name = "aphesis-content"
main = "build/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[build]
# worker-build is installed once, pinned: cargo install worker-build@0.8.7 --locked
command = "worker-build --release"

[vars]
# the site's origins, comma-separated: CORS answers only these, and the gate takes requests only from them
ALLOWED_ORIGINS = "https://aphes.ist,https://www.aphes.ist,https://aphesist.pages.dev"
# the gate's email comes from this address (Email Routing must have the zone set up; see ../README.md)
EMAIL_FROM = "clavis@aphes.ist"
# the session lasts this long, in seconds (two hours)
SESSION_SECONDS = "7200"
# the APIs moderated from the dashboard, called server to server with their admin secrets
WALL_API = "https://wall-api.aphes.ist"
FORUM_API = "https://forum-api.aphes.ist"
# the nightly export: the repository and branch it commits to, and the API's public address for picture URLs
EXPORT_REPO = "aphesimos/aphesis"
EXPORT_BRANCH = "content"
PUBLIC_URL = "https://content-api.aphes.ist"

# every night at 03:17 UTC, the content is exported as markdown to the content branch
[triggers]
crons = ["17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "aphesis-content"
# the deploy fills in the id of the database it finds or creates; local runs need none
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "aphesis-content"

# the gate's email: to the owner's verified address (OWNER_EMAIL), never named here
[[send_email]]
name = "MAIL"

# The custom domain is added by the deploy workflow when BACKEND_CUSTOM_DOMAINS = 1:
# routes = [{ pattern = "content-api.aphes.ist", custom_domain = true }]
